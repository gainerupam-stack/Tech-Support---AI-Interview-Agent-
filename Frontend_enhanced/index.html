<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AI Interview Agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root, [data-theme="dark"] {
  --bg: #05060A;
  --bg2: #080A12;
  --bg3: #0D101A;
  --card: rgba(13, 16, 26, 0.72);
  --card-solid: #0D101A;
  --border: rgba(255,255,255,0.06);
  --border-strong: rgba(255,255,255,0.1);
  --text: #F1F5F9;
  --text-secondary: #94A3B8;
  --muted: #64748B;
  --primary: #7C5CFF;
  --primary-soft: rgba(124, 92, 255, 0.12);
  --secondary: #5B8CFF;
  --violet: #A78BFA;
  --success: #34D399;
  --success-soft: rgba(52, 211, 153, 0.12);
  --warning: #FBBF24;
  --warning-soft: rgba(251, 191, 36, 0.12);
  --error: #FB7185;
  --error-soft: rgba(251, 113, 133, 0.12);
  --radius: 18px;
  --radius-sm: 12px;
  --radius-xs: 8px;
  --font: "Inter", system-ui, -apple-system, sans-serif;
  --shadow: 0 0 0 1px rgba(255,255,255,0.04), 0 8px 32px rgba(0,0,0,0.4);
  --shadow-hover: 0 0 0 1px rgba(124,92,255,0.25), 0 12px 40px rgba(0,0,0,0.5);
  --glow: 0 0 40px rgba(124, 92, 255, 0.15);
  --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  --nav-bg: rgba(5, 6, 10, 0.75);
  --hero-grad: linear-gradient(135deg, #F8FAFC 0%, #C4B5FD 45%, #5B8CFF 100%);
  --ambient-1: rgba(124, 92, 255, 0.12);
  --ambient-2: rgba(91, 140, 255, 0.06);
  --bubble-bot-bg: rgba(255,255,255,0.04);
  --bubble-user-bg: linear-gradient(135deg, rgba(124, 92, 255, 0.35), rgba(91, 140, 255, 0.28));
  --bubble-user-border: rgba(124, 92, 255, 0.25);
  --composer-bg: rgba(0,0,0,0.25);
  --preview-bar-bg: rgba(0,0,0,0.25);
  --score-grad: linear-gradient(135deg, #F1F5F9, var(--violet));
  --chart-track: rgba(255,255,255,0.06);
  --chart-grid: rgba(255,255,255,0.04);
}

[data-theme="light"] {
  --bg: #F7F8FC;
  --bg2: #FFFFFF;
  --bg3: #EEF0F7;
  --card: rgba(255, 255, 255, 0.88);
  --card-solid: #FFFFFF;
  --border: rgba(15, 23, 42, 0.08);
  --border-strong: rgba(15, 23, 42, 0.12);
  --text: #0F172A;
  --text-secondary: #475569;
  --muted: #64748B;
  --primary: #6D4AFF;
  --primary-soft: rgba(109, 74, 255, 0.1);
  --secondary: #3B82F6;
  --violet: #7C5CFF;
  --success: #059669;
  --success-soft: rgba(5, 150, 105, 0.1);
  --warning: #D97706;
  --warning-soft: rgba(217, 119, 6, 0.1);
  --error: #E11D48;
  --error-soft: rgba(225, 29, 72, 0.1);
  --shadow: 0 0 0 1px rgba(15,23,42,0.04), 0 8px 28px rgba(15,23,42,0.06);
  --shadow-hover: 0 0 0 1px rgba(109,74,255,0.2), 0 12px 32px rgba(15,23,42,0.1);
  --glow: 0 0 40px rgba(109, 74, 255, 0.1);
  --nav-bg: rgba(247, 248, 252, 0.85);
  --hero-grad: linear-gradient(135deg, #0F172A 0%, #5B21B6 50%, #3B82F6 100%);
  --ambient-1: rgba(109, 74, 255, 0.08);
  --ambient-2: rgba(59, 130, 246, 0.05);
  --bubble-bot-bg: #F1F5F9;
  --bubble-user-bg: linear-gradient(135deg, rgba(109, 74, 255, 0.9), rgba(59, 130, 246, 0.85));
  --bubble-user-border: rgba(109, 74, 255, 0.3);
  --composer-bg: rgba(241, 245, 249, 0.9);
  --preview-bar-bg: rgba(241, 245, 249, 0.95);
  --score-grad: linear-gradient(135deg, #0F172A, #6D4AFF);
  --chart-track: rgba(15, 23, 42, 0.08);
  --chart-grid: rgba(15, 23, 42, 0.06);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { scroll-behavior: smooth; }

body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  background-image:
    radial-gradient(ellipse 80% 50% at 50% -20%, var(--ambient-1), transparent),
    radial-gradient(ellipse 60% 40% at 100% 0%, var(--ambient-2), transparent);
  background-attachment: fixed;
  transition: background-color 0.25s ease, color 0.25s ease;
}

button {
  font-family: inherit;
  cursor: pointer;
  border: none;
  border-radius: var(--radius-sm);
  font-weight: 600;
  position: relative;
  overflow: hidden;
  transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), opacity var(--transition), background var(--transition), box-shadow 0.3s ease, border-color var(--transition), color var(--transition), filter 0.25s ease;
}
button:active:not(:disabled) { transform: scale(0.96); }
button:disabled { opacity: 0.45; cursor: not-allowed; }

.btn-primary {
  background: linear-gradient(135deg, #7C5CFF 0%, #5B8CFF 55%, #7C5CFF 100%);
  background-size: 200% 200%;
  color: #fff;
  padding: 12px 22px;
  font-size: 14px;
  letter-spacing: -0.01em;
  box-shadow: 0 0 0 1px rgba(124,92,255,0.3), 0 4px 16px rgba(124,92,255,0.25);
  isolation: isolate;
}
.btn-primary::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(105deg, transparent 40%, rgba(255,255,255,0.35) 50%, transparent 60%);
  transform: translateX(-120%);
  transition: transform 0.55s ease;
  z-index: 1;
  pointer-events: none;
}
.btn-primary > * { position: relative; z-index: 2; }
.btn-primary:hover:not(:disabled) {
  background-position: 100% 50%;
  box-shadow:
    0 0 0 1px rgba(124,92,255,0.55),
    0 8px 28px rgba(124,92,255,0.45),
    0 0 40px rgba(91,140,255,0.2);
  filter: brightness(1.08);
  transform: translateY(-2px);
}
.btn-primary:hover:not(:disabled)::before {
  transform: translateX(120%);
}
.btn-primary:active:not(:disabled) {
  transform: translateY(0) scale(0.97);
  box-shadow: 0 0 0 1px rgba(124,92,255,0.4), 0 2px 10px rgba(124,92,255,0.3);
}

/* Signature CTA — Start Interview */
.btn-cta {
  background: linear-gradient(135deg, #7C5CFF 0%, #5B8CFF 40%, #A78BFA 100%);
  background-size: 220% 220%;
  animation: cta-idle 3s ease-in-out infinite, cta-ring 2.4s ease-out infinite;
  box-shadow:
    0 0 0 1px rgba(124,92,255,0.4),
    0 4px 20px rgba(124,92,255,0.35),
    0 0 32px rgba(124,92,255,0.15);
  letter-spacing: 0.01em;
  font-weight: 700;
}
.btn-cta::after {
  content: '';
  position: absolute;
  inset: -2px;
  border-radius: inherit;
  background: linear-gradient(135deg, rgba(124,92,255,0.6), rgba(91,140,255,0.3), rgba(167,139,250,0.5));
  z-index: -1;
  opacity: 0;
  filter: blur(10px);
  transition: opacity 0.35s ease;
}
.btn-cta:hover:not(:disabled) {
  animation: cta-hover 1.2s ease infinite;
  transform: translateY(-3px) scale(1.02);
  box-shadow:
    0 0 0 1px rgba(167,139,250,0.6),
    0 12px 36px rgba(124,92,255,0.5),
    0 0 48px rgba(91,140,255,0.3);
}
.btn-cta:hover:not(:disabled)::after { opacity: 1; }
.btn-cta .cta-arrow {
  display: inline-block;
  transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  margin-left: 4px;
}
.btn-cta:hover:not(:disabled) .cta-arrow {
  transform: translateX(5px);
}

@keyframes cta-idle {
  0%, 100% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
}
@keyframes cta-hover {
  0%, 100% { background-position: 0% 50%; filter: brightness(1.08); }
  50% { background-position: 100% 50%; filter: brightness(1.15); }
}

.btn-ghost {
  background: transparent;
  color: var(--text-secondary);
  padding: 10px 16px;
  border: 1px solid var(--border-strong);
  font-size: 14px;
  overflow: hidden;
}
.btn-ghost::before {
  content: '';
  position: absolute;
  inset: 0;
  background: var(--primary-soft);
  opacity: 0;
  transition: opacity 0.25s ease;
  z-index: -1;
}
.btn-ghost:hover:not(:disabled) {
  color: var(--text);
  border-color: rgba(124, 92, 255, 0.35);
  transform: translateY(-1px);
  box-shadow: 0 4px 16px rgba(124, 92, 255, 0.1);
}
.btn-ghost:hover:not(:disabled)::before { opacity: 1; }
[data-theme="light"] .btn-ghost:hover:not(:disabled) {
  border-color: rgba(109, 74, 255, 0.35);
}

/* ─── Nav ─── */
.nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 28px;
  border-bottom: 1px solid var(--border);
  background: var(--nav-bg);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  position: sticky;
  top: 0;
  z-index: 100;
  gap: 8px;
}
.theme-toggle {
  width: 40px;
  height: 40px;
  border-radius: 10px;
  background: var(--primary-soft);
  border: 1px solid rgba(124, 92, 255, 0.3);
  color: var(--text-secondary);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  flex-shrink: 0;
  transition: transform 0.25s ease, border-color 0.25s ease, background 0.25s ease, color 0.25s ease, box-shadow 0.25s ease;
}
.theme-toggle:hover {
  color: var(--text);
  border-color: rgba(124, 92, 255, 0.5);
  background: rgba(124, 92, 255, 0.18);
  box-shadow: 0 0 14px rgba(124, 92, 255, 0.2);
  transform: translateY(-1px);
}
.theme-toggle svg { width: 18px; height: 18px; }
@media (max-width: 700px) {
  .theme-toggle { width: 38px; height: 38px; }
  .theme-toggle svg { width: 17px; height: 17px; }
}
.nav-brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 700;
  font-size: 15px;
  background: none;
  color: var(--text);
  border: none;
  padding: 0;
  letter-spacing: -0.02em;
}
.nav-brand .orb {
  width: 26px; height: 26px;
  border-radius: 50%;
  background: radial-gradient(circle at 32% 28%, #C4B5FD, #7C5CFF 55%, #2E1065);
  box-shadow: 0 0 12px rgba(124, 92, 255, 0.45);
  flex-shrink: 0;
  position: relative;
}
.nav-brand .orb.thinking {
  animation: orb-pulse 1.4s ease-in-out infinite;
}
.nav-brand .orb.live::after {
  content: '';
  position: absolute;
  bottom: -1px; right: -1px;
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--success);
  border: 2px solid var(--bg);
  box-shadow: 0 0 6px var(--success);
}
@keyframes orb-pulse {
  0%, 100% { transform: scale(1); box-shadow: 0 0 12px rgba(124, 92, 255, 0.45); }
  50% { transform: scale(1.08); box-shadow: 0 0 20px rgba(124, 92, 255, 0.7); }
}
.nav-links { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
.nav-links button {
  background: none;
  color: var(--muted);
  padding: 7px 14px;
  border-radius: 8px;
  font-weight: 500;
  font-size: 13px;
}
.nav-links button:hover, .nav-links button.active {
  color: var(--text);
  background: var(--primary-soft);
}
.nav-status {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  color: var(--text-secondary);
  margin-left: 12px;
  padding-left: 12px;
  border-left: 1px solid var(--border);
}
.nav-status .dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--muted);
}
.nav-status .dot.on { background: var(--success); box-shadow: 0 0 6px var(--success); }
.nav-status .dot.off { background: var(--error); }

/* ─── Layout ─── */
.page {
  max-width: 1120px;
  margin: 0 auto;
  padding: 40px 24px 80px;
}
.page-wide {
  max-width: 1280px;
  margin: 0 auto;
  padding: 24px 20px 48px;
}
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 22px;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  box-shadow: var(--shadow);
}
.muted { color: var(--muted); }
.text-sec { color: var(--text-secondary); }
.badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  font-weight: 600;
  padding: 4px 10px;
  border-radius: 999px;
  letter-spacing: 0.02em;
  background: var(--primary-soft);
  color: var(--violet);
}
.badge.live { background: var(--success-soft); color: var(--success); }
.badge.err { background: var(--error-soft); color: var(--error); }
.badge.ready { background: rgba(255,255,255,0.05); color: var(--text-secondary); }

/* ─── Landing ─── */
.hero {
  text-align: center;
  padding: 72px 16px 40px;
  position: relative;
}
.hero-orb {
  width: 88px; height: 88px;
  margin: 0 auto 32px;
  border-radius: 50%;
  background: radial-gradient(circle at 30% 28%, #DDD6FE, #7C5CFF 50%, #1E1B4B);
  box-shadow: 0 0 48px rgba(124, 92, 255, 0.35), 0 0 96px rgba(91, 140, 255, 0.12);
  animation: hero-breathe 4s ease-in-out infinite;
  position: relative;
}
.hero-orb::after {
  content: '';
  position: absolute;
  inset: -12px;
  border-radius: 50%;
  border: 1px solid rgba(124, 92, 255, 0.2);
  animation: hero-ring 4s ease-in-out infinite;
}
@keyframes hero-breathe {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.04); }
}
@keyframes hero-ring {
  0%, 100% { opacity: 0.4; transform: scale(1); }
  50% { opacity: 0.8; transform: scale(1.06); }
}
.hero-eyebrow {
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--violet);
  margin-bottom: 16px;
}
.hero h1 {
  font-size: clamp(2.2rem, 5.5vw, 3.4rem);
  font-weight: 800;
  letter-spacing: -0.04em;
  line-height: 1.1;
  margin-bottom: 18px;
  background: var(--hero-grad);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.hero-sub {
  color: var(--text-secondary);
  max-width: 520px;
  margin: 0 auto 32px;
  font-size: 17px;
  line-height: 1.6;
}
.hero-actions {
  display: flex;
  gap: 12px;
  justify-content: center;
  flex-wrap: wrap;
}
.hero-preview {
  margin: 56px auto 0;
  max-width: 720px;
  border-radius: 20px;
  border: 1px solid var(--border-strong);
  background: var(--bg3);
  overflow: hidden;
  box-shadow: var(--glow), var(--shadow);
}
.preview-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  background: var(--preview-bar-bg);
}
.preview-dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.12); }
.preview-dot.r { background: #FB7185; }
.preview-dot.y { background: #FBBF24; }
.preview-dot.g { background: #34D399; }
.preview-title { font-size: 12px; color: var(--muted); margin-left: 8px; }
.preview-body { padding: 20px; display: grid; gap: 12px; }
.preview-msg {
  max-width: 85%;
  padding: 12px 16px;
  border-radius: 14px;
  font-size: 13px;
  line-height: 1.5;
}
.preview-msg.ai {
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--border);
  align-self: start;
}
.preview-msg.user {
  background: linear-gradient(135deg, rgba(124,92,255,0.3), rgba(91,140,255,0.25));
  border: 1px solid rgba(124,92,255,0.25);
  align-self: end;
  margin-left: auto;
}
.preview-msg.meta {
  font-size: 11px;
  color: var(--success);
  background: var(--success-soft);
  border: 1px solid rgba(52,211,153,0.2);
  max-width: 70%;
}
.features {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
  gap: 14px;
  margin-top: 56px;
}
.feature {
  text-align: left;
  transition: border-color 0.3s ease, transform 0.35s cubic-bezier(0.34, 1.2, 0.64, 1), box-shadow 0.3s ease;
}
.feature:hover {
  border-color: rgba(124, 92, 255, 0.3);
  transform: translateY(-4px);
  box-shadow: var(--shadow-hover);
}
.feature-icon {
  width: 36px; height: 36px;
  border-radius: 10px;
  background: var(--primary-soft);
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 14px;
  font-size: 16px;
  transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.3s ease, box-shadow 0.3s ease;
}
.feature:hover .feature-icon {
  transform: scale(1.12) rotate(-4deg);
  background: rgba(124, 92, 255, 0.22);
  box-shadow: 0 0 16px rgba(124, 92, 255, 0.25);
}
.feature h3 { font-size: 14px; font-weight: 600; margin-bottom: 6px; letter-spacing: -0.01em; }
.feature p { font-size: 13px; color: var(--muted); line-height: 1.5; }
.how { margin-top: 72px; }
.how h2 {
  text-align: center;
  margin-bottom: 32px;
  font-size: 1.4rem;
  font-weight: 700;
  letter-spacing: -0.02em;
}
.steps {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 14px;
}
.step { text-align: center; padding: 24px 16px; }
.step-num {
  width: 36px; height: 36px;
  border-radius: 50%;
  background: var(--primary-soft);
  color: var(--violet);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 14px;
  margin-bottom: 12px;
  border: 1px solid rgba(124, 92, 255, 0.2);
}
.step h4 { font-size: 14px; margin-bottom: 4px; font-weight: 600; }
.step p { font-size: 12px; color: var(--muted); }

/* ─── Dashboard ─── */
.dash-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 16px;
  margin-bottom: 28px;
  flex-wrap: wrap;
}
.dash-header h1 {
  font-size: 1.5rem;
  font-weight: 700;
  letter-spacing: -0.03em;
  margin-bottom: 4px;
}
.search-wrap {
  position: relative;
  margin-bottom: 20px;
}
.search-wrap svg {
  position: absolute;
  left: 14px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--muted);
  pointer-events: none;
}
.search {
  width: 100%;
  max-width: 400px;
  padding: 12px 14px 12px 42px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-strong);
  background: var(--bg2);
  color: var(--text);
  font-size: 14px;
  outline: none;
  transition: border-color var(--transition);
}
.search:focus { border-color: rgba(124, 92, 255, 0.5); }
.config-bar {
  font-size: 12px;
  color: var(--muted);
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  padding: 12px 14px;
  background: var(--bg2);
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
}
.config-bar input {
  background: var(--bg);
  border: 1px solid var(--border-strong);
  color: var(--text);
  padding: 7px 10px;
  border-radius: 8px;
  font-size: 12px;
  min-width: 240px;
  outline: none;
}
.selected-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 16px 20px;
  background: var(--primary-soft);
  border: 1px solid rgba(124, 92, 255, 0.3);
  border-radius: var(--radius);
  margin-bottom: 24px;
  flex-wrap: wrap;
}
/* Fixed dock — always visible after selection, even if user is scrolled down */
.selected-dock {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 90;
  padding: 12px 16px;
  padding-bottom: max(12px, env(safe-area-inset-bottom));
  background: var(--nav-bg);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-top: 1px solid var(--border-strong);
  box-shadow: 0 -8px 32px rgba(0,0,0,0.25);
  display: flex;
  align-items: center;
  justify-content: center;
  animation: dock-rise 0.4s cubic-bezier(0.34, 1.2, 0.64, 1);
}
@keyframes dock-rise {
  from { transform: translateY(100%); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}
.selected-dock-inner {
  width: 100%;
  max-width: 1120px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  flex-wrap: wrap;
}
.selected-dock .btn-primary {
  flex-shrink: 0;
  min-width: 160px;
}
body.has-selected-dock .page {
  padding-bottom: 110px;
}
.cand-card .card-start-btn {
  display: none;
  width: 100%;
  margin-top: 12px;
  padding: 10px 14px;
  font-size: 13px;
  animation: btn-pop 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
}
@keyframes btn-pop {
  from { opacity: 0; transform: translateY(8px) scale(0.95); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
.cand-card.selected .card-start-btn {
  display: block;
}
.cand-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
  gap: 14px;
}
.cand-card {
  cursor: pointer;
  transition: border-color 0.3s ease, transform 0.35s cubic-bezier(0.34, 1.2, 0.64, 1), box-shadow 0.3s ease, background 0.3s ease;
  position: relative;
  overflow: hidden;
}
.cand-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--primary), var(--secondary), transparent);
  opacity: 0;
  transition: opacity 0.3s ease;
}
.cand-card:hover {
  border-color: rgba(124, 92, 255, 0.35);
  transform: translateY(-4px);
  box-shadow: var(--shadow-hover);
}
.cand-card:hover::before { opacity: 1; }
.cand-card.selected {
  border-color: rgba(124, 92, 255, 0.55);
  box-shadow: 0 0 0 1px rgba(124, 92, 255, 0.35), 0 8px 32px rgba(124, 92, 255, 0.15), var(--shadow);
  background: rgba(124, 92, 255, 0.08);
  animation: select-pulse 0.5s ease;
}
.cand-card.selected::before { opacity: 1; }
@keyframes select-pulse {
  0% { box-shadow: 0 0 0 0 rgba(124, 92, 255, 0.4); }
  70% { box-shadow: 0 0 0 8px rgba(124, 92, 255, 0); }
  100% { box-shadow: 0 0 0 1px rgba(124, 92, 255, 0.35), 0 8px 32px rgba(124, 92, 255, 0.15), var(--shadow); }
}
.cand-card-top {
  display: flex;
  gap: 14px;
  align-items: flex-start;
  margin-bottom: 14px;
}
.avatar {
  width: 42px; height: 42px;
  border-radius: 12px;
  background: linear-gradient(135deg, rgba(124,92,255,0.3), rgba(91,140,255,0.2));
  border: 1px solid rgba(124, 92, 255, 0.25);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 14px;
  color: var(--violet);
  flex-shrink: 0;
  letter-spacing: -0.02em;
  transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease, border-color 0.3s ease;
}
.cand-card:hover .avatar,
.cand-card.selected .avatar {
  transform: scale(1.08);
  box-shadow: 0 0 16px rgba(124, 92, 255, 0.35);
  border-color: rgba(124, 92, 255, 0.5);
}
.btn-send {
  min-width: 88px;
}
.btn-send:hover:not(:disabled) {
  transform: translateY(-2px) scale(1.03);
}
/* theme-toggle hover enhanced in base styles */
.score-display .big {
  transition: transform 0.3s ease;
  animation: score-glow 3s ease-in-out infinite;
}
@keyframes score-glow {
  0%, 100% { filter: brightness(1); }
  50% { filter: brightness(1.15); }
}
.step {
  transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
}
.step:hover {
  transform: translateY(-3px);
  border-color: rgba(124, 92, 255, 0.25);
  box-shadow: var(--shadow-hover);
}
.step:hover .step-num {
  transform: scale(1.1);
  box-shadow: 0 0 14px rgba(124, 92, 255, 0.3);
}
.step-num {
  transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease;
}
.hero-preview {
  transition: transform 0.4s ease, box-shadow 0.4s ease;
}
.hero-preview:hover {
  transform: translateY(-4px);
  box-shadow: 0 0 60px rgba(124, 92, 255, 0.2), var(--shadow);
}
.nav-links button {
  transition: color 0.2s ease, background 0.2s ease, transform 0.2s ease;
}
.nav-links button:hover {
  transform: translateY(-1px);
}
.cand-card h3 {
  font-size: 14px;
  font-weight: 600;
  margin-bottom: 3px;
  letter-spacing: -0.01em;
}
.cand-meta { font-size: 12px; color: var(--muted); }
.cand-stats {
  display: flex;
  gap: 16px;
  padding-top: 12px;
  border-top: 1px solid var(--border);
  font-size: 11px;
}
.cand-stats span { color: var(--muted); }
.cand-stats strong { color: var(--text-secondary); font-weight: 600; display: block; font-size: 13px; margin-top: 2px; }

/* ─── Curriculum ─── */
.journey-header { margin-bottom: 32px; }
.journey-header h1 {
  font-size: 1.5rem;
  font-weight: 700;
  letter-spacing: -0.03em;
  margin-bottom: 6px;
}
.mod-block { margin-bottom: 28px; }
.mod-label {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
}
.mod-label .mod-n {
  font-size: 11px;
  font-weight: 700;
  color: var(--violet);
  background: var(--primary-soft);
  padding: 3px 8px;
  border-radius: 6px;
  letter-spacing: 0.04em;
}
.mod-label h3 {
  font-size: 14px;
  font-weight: 600;
  letter-spacing: -0.01em;
}
.day-list {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 8px;
  position: relative;
}
.day-item {
  display: flex;
  gap: 12px;
  align-items: flex-start;
  padding: 12px 14px;
  background: var(--bg2);
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  font-size: 13px;
  transition: border-color 0.25s ease, transform 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
}
.day-item:hover {
  border-color: rgba(124, 92, 255, 0.3);
  transform: translateX(4px);
  box-shadow: 0 4px 16px rgba(124, 92, 255, 0.08);
  background: var(--primary-soft);
}
.day-item:hover .day-num {
  transform: scale(1.08);
  box-shadow: 0 0 12px rgba(124, 92, 255, 0.3);
}
.day-num {
  flex-shrink: 0;
  width: 30px; height: 30px;
  border-radius: 9px;
  background: var(--primary-soft);
  color: var(--violet);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 12px;
  border: 1px solid rgba(124, 92, 255, 0.15);
  transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.25s ease;
}
.day-type {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--muted);
  margin-top: 2px;
}

/* ─── Interview Command Center ─── */
.interview-layout {
  display: grid;
  grid-template-columns: 240px 1fr 240px;
  gap: 16px;
  min-height: calc(100vh - 120px);
}
.side-panel { display: flex; flex-direction: column; gap: 12px; }
.side-panel .card { padding: 16px; }
.side-label {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 10px;
}
.progress-dots {
  display: flex;
  gap: 5px;
  flex-wrap: wrap;
  margin-top: 10px;
}
.progress-dots span {
  width: 10px; height: 10px;
  border-radius: 50%;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.1);
  transition: background var(--transition);
}
.progress-dots span.done { background: var(--success); border-color: var(--success); }
.progress-dots span.current {
  background: var(--primary);
  border-color: var(--primary);
  box-shadow: 0 0 8px rgba(124, 92, 255, 0.5);
}
.progress-dots span.pending { background: transparent; }
.stat-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 13px;
  padding: 7px 0;
  border-bottom: 1px solid var(--border);
}
.stat-row:last-child { border-bottom: none; }
.stat-row span { color: var(--muted); }
.stat-row strong { font-weight: 600; font-size: 13px; }

.chat-panel {
  display: flex;
  flex-direction: column;
  height: min(calc(100vh - 120px), 700px);
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  box-shadow: var(--shadow);
  backdrop-filter: blur(8px);
}
.chat-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 18px;
  border-bottom: 1px solid var(--border);
  background: var(--composer-bg);
}
.chat-header-left {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 13px;
  font-weight: 600;
}
.chat-messages {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  scroll-behavior: smooth;
}
.bubble {
  max-width: 88%;
  padding: 13px 16px;
  border-radius: 16px;
  font-size: 14px;
  line-height: 1.55;
  white-space: pre-wrap;
  word-break: break-word;
  animation: msg-in 0.3s ease-out;
}
@keyframes msg-in {
  from { opacity: 0; transform: translateY(12px) scale(0.98); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
.bubble.bot { animation: msg-in 0.4s cubic-bezier(0.34, 1.2, 0.64, 1); }
.bubble.user { animation: msg-in-right 0.35s cubic-bezier(0.34, 1.2, 0.64, 1); }
@keyframes msg-in-right {
  from { opacity: 0; transform: translateX(12px) scale(0.98); }
  to { opacity: 1; transform: translateX(0) scale(1); }
}
.bubble.bot {
  background: var(--bubble-bot-bg);
  border: 1px solid var(--border);
  align-self: flex-start;
  border-bottom-left-radius: 4px;
  color: var(--text);
}
.bubble.user {
  background: var(--bubble-user-bg);
  border: 1px solid var(--bubble-user-border);
  align-self: flex-end;
  border-bottom-right-radius: 4px;
  color: #fff;
}
.bubble.system {
  align-self: center;
  background: transparent;
  color: var(--muted);
  font-size: 12px;
  text-align: center;
  padding: 4px 12px;
}
.bubble.meta {
  font-size: 12px;
  color: var(--success);
  background: var(--success-soft);
  border: 1px solid rgba(52, 211, 153, 0.2);
  align-self: flex-start;
  padding: 8px 14px;
}
.thinking-row {
  display: flex;
  align-items: center;
  gap: 12px;
  align-self: flex-start;
  padding: 12px 16px;
  background: rgba(124, 92, 255, 0.06);
  border: 1px solid rgba(124, 92, 255, 0.2);
  border-radius: 14px;
  font-size: 12px;
  color: var(--text-secondary);
  animation: msg-in 0.3s ease-out;
  position: relative;
  overflow: hidden;
}
.thinking-row::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(105deg, transparent 40%, rgba(124, 92, 255, 0.12) 50%, transparent 60%);
  animation: think-shimmer 1.8s ease-in-out infinite;
  pointer-events: none;
}
@keyframes think-shimmer {
  0% { transform: translateX(-100%); }
  100% { transform: translateX(100%); }
}
.thinking {
  display: flex;
  gap: 5px;
  position: relative;
  z-index: 1;
}
.thinking span {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--violet);
  animation: bounce 1.2s infinite;
  box-shadow: 0 0 8px rgba(124, 92, 255, 0.5);
}
.thinking span:nth-child(2) { animation-delay: 0.15s; }
.thinking span:nth-child(3) { animation-delay: 0.3s; }
@keyframes bounce {
  0%, 80%, 100% { transform: translateY(0); opacity: 0.35; }
  40% { transform: translateY(-6px); opacity: 1; }
}
.thinking-label {
  position: relative;
  z-index: 1;
  font-weight: 500;
  letter-spacing: 0.02em;
}

/* Full-screen AI loading overlay */
.loading-overlay {
  position: fixed;
  inset: 0;
  z-index: 200;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 20px;
  background: rgba(5, 6, 10, 0.72);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  animation: overlay-in 0.25s ease;
}
[data-theme="light"] .loading-overlay {
  background: rgba(247, 248, 252, 0.78);
}
@keyframes overlay-in {
  from { opacity: 0; }
  to { opacity: 1; }
}
.loading-orb {
  width: 64px;
  height: 64px;
  border-radius: 50%;
  background: radial-gradient(circle at 30% 28%, #DDD6FE, #7C5CFF 55%, #1E1B4B);
  box-shadow: 0 0 40px rgba(124, 92, 255, 0.45);
  animation: load-orb 1.6s ease-in-out infinite;
  position: relative;
}
.loading-orb::before {
  content: '';
  position: absolute;
  inset: -10px;
  border-radius: 50%;
  border: 2px solid transparent;
  border-top-color: var(--primary);
  border-right-color: rgba(91, 140, 255, 0.4);
  animation: load-spin 1s linear infinite;
}
@keyframes load-orb {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.08); }
}
@keyframes load-spin {
  to { transform: rotate(360deg); }
}
.loading-text {
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
  letter-spacing: -0.01em;
}
.loading-sub {
  font-size: 12px;
  color: var(--muted);
  margin-top: -8px;
}
.loading-bar {
  width: 160px;
  height: 3px;
  border-radius: 99px;
  background: rgba(124, 92, 255, 0.15);
  overflow: hidden;
}
.loading-bar > span {
  display: block;
  height: 100%;
  width: 40%;
  border-radius: 99px;
  background: linear-gradient(90deg, var(--primary), var(--secondary));
  animation: load-bar 1.2s ease-in-out infinite;
}
@keyframes load-bar {
  0% { transform: translateX(-100%); }
  100% { transform: translateX(350%); }
}

/* Scroll progress */
.scroll-progress {
  position: fixed;
  top: 0;
  left: 0;
  height: 3px;
  width: 0%;
  z-index: 120;
  background: linear-gradient(90deg, #7C5CFF, #5B8CFF, #A78BFA);
  box-shadow: 0 0 12px rgba(124, 92, 255, 0.5);
  transition: width 0.05s linear;
  pointer-events: none;
}

/* Reveal on scroll */
.reveal {
  opacity: 0;
  transform: translateY(28px);
  transition: opacity 0.6s cubic-bezier(0.22, 1, 0.36, 1), transform 0.6s cubic-bezier(0.22, 1, 0.36, 1);
}
.reveal.visible {
  opacity: 1;
  transform: translateY(0);
}
.reveal-delay-1 { transition-delay: 0.08s; }
.reveal-delay-2 { transition-delay: 0.16s; }
.reveal-delay-3 { transition-delay: 0.24s; }
.reveal-delay-4 { transition-delay: 0.32s; }
.composer {
  display: flex;
  gap: 10px;
  padding: 14px 16px;
  border-top: 1px solid var(--border);
  background: var(--composer-bg);
  align-items: flex-end;
}
.composer textarea {
  flex: 1;
  resize: none;
  min-height: 48px;
  max-height: 140px;
  padding: 12px 14px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-strong);
  background: var(--bg);
  color: var(--text);
  font-family: inherit;
  font-size: 14px;
  outline: none;
  line-height: 1.45;
  transition: border-color var(--transition);
}
.composer textarea:focus { border-color: rgba(124, 92, 255, 0.5); }
.composer textarea::placeholder { color: var(--muted); }
.composer button { padding: 12px 20px; flex-shrink: 0; }

.score-display {
  text-align: center;
  padding: 8px 0 4px;
}
.score-display .big {
  font-size: 2.2rem;
  font-weight: 800;
  letter-spacing: -0.04em;
  line-height: 1;
  background: var(--score-grad);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.score-display .label {
  font-size: 11px;
  color: var(--muted);
  margin-top: 4px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
.ai-status {
  font-size: 12px;
  color: var(--text-secondary);
  padding: 8px 10px;
  background: rgba(255,255,255,0.03);
  border-radius: 8px;
  border: 1px solid var(--border);
  margin-top: 8px;
}
.mobile-toggle {
  display: none;
  width: 100%;
  padding: 10px;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text-secondary);
  font-size: 12px;
  font-weight: 600;
  margin-bottom: 8px;
}

/* ─── Report ─── */
.report-hero {
  text-align: center;
  margin-bottom: 40px;
  padding: 32px 16px;
  position: relative;
}
.score-ring-wrap {
  width: 160px; height: 160px;
  margin: 0 auto 20px;
  position: relative;
}
.score-ring-wrap canvas { width: 160px !important; height: 160px !important; }
.score-center {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  pointer-events: none;
}
.score-center strong {
  font-size: 2.4rem;
  font-weight: 800;
  letter-spacing: -0.04em;
  line-height: 1;
}
.score-center span { font-size: 12px; color: var(--muted); margin-top: 2px; }
.report-verdict {
  display: inline-block;
  margin-top: 12px;
  padding: 5px 14px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}
.report-verdict.strong { background: var(--success-soft); color: var(--success); }
.report-verdict.moderate { background: var(--warning-soft); color: var(--warning); }
.report-verdict.develop { background: var(--error-soft); color: var(--error); }
.report-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  margin-bottom: 14px;
}
.list-block ul { padding-left: 18px; margin-top: 10px; }
.list-block li { margin-bottom: 8px; font-size: 14px; line-height: 1.45; }
.list-block.strengths li { color: #6EE7B7; }
.list-block.weaknesses li { color: #FDA4AF; }
.para {
  font-size: 14px;
  color: var(--text-secondary);
  margin-top: 10px;
  white-space: pre-wrap;
  line-height: 1.6;
}
.section-title {
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 4px;
}
.report-actions {
  display: flex;
  gap: 12px;
  justify-content: center;
  margin-top: 32px;
  flex-wrap: wrap;
}
.developer-details {
  margin-top: 16px;
  margin-bottom: 8px;
}
.developer-details summary {
  cursor: pointer;
  font-size: 13px;
  color: var(--muted);
  font-weight: 500;
  padding: 12px 16px;
  list-style: none;
}
.developer-details summary::-webkit-details-marker { display: none; }
.developer-details summary::before {
  content: '▸ ';
  color: var(--muted);
}
.developer-details[open] summary::before { content: '▾ '; }
.developer-details pre {
  margin: 0 16px 16px;
  font-size: 12px;
  white-space: pre-wrap;
  color: var(--muted);
  line-height: 1.5;
  max-height: 240px;
  overflow-y: auto;
}

.error-box {
  background: var(--error-soft);
  border: 1px solid rgba(251, 113, 133, 0.3);
  color: #FDA4AF;
  padding: 12px 14px;
  border-radius: var(--radius-sm);
  font-size: 13px;
  margin: 8px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
}

/* Light-theme list accents */
[data-theme="light"] .list-block.strengths li { color: #047857; }
[data-theme="light"] .list-block.weaknesses li { color: #BE123C; }
[data-theme="light"] .bubble.meta { color: #047857; }
[data-theme="light"] .preview-msg.user { color: #fff; }
[data-theme="light"] .preview-msg.ai { background: #F1F5F9; color: var(--text); }
[data-theme="light"] .thinking-row { background: #F8FAFC; }

/* ─── Responsive ─── */
@media (max-width: 960px) {
  .interview-layout {
    grid-template-columns: 1fr;
    min-height: auto;
    gap: 10px;
  }
  .side-panel { display: none; }
  .side-panel.mobile-open {
    display: flex;
    flex-direction: row;
    flex-wrap: wrap;
    gap: 10px;
  }
  .side-panel.mobile-open .card {
    flex: 1 1 160px;
    min-width: 140px;
  }
  .mobile-toggle { display: flex; align-items: center; justify-content: center; gap: 6px; }
  .chat-panel {
    height: calc(100dvh - 150px);
    min-height: 380px;
  }
  .page-wide { padding: 10px 12px 20px; }
  .nav { padding: 10px 14px; }
  .nav-status { display: none; }
  .nav-brand { font-size: 13px; }

  const inp = document.getElementById('api-base-input');
  const override = inp ? inp.value.trim().replace(/\/$/, '') : null;
  const base = (override != null && override !== '') ? override : (window.__API_BASE_URL || API_BASE_URL);
  const url = (base || '') + INTERVIEW_ENDPOINT;
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 60000);
  try {
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
      signal: ctrl.signal,
    });
    clearTimeout(timer);
    if (!res.ok) {
      let detail = res.statusText;
      try {
        const j = await res.json();
        detail = j.detail || JSON.stringify(j);
      } catch (_) {}
      throw new Error(typeof detail === 'string' ? detail : JSON.stringify(detail));
    }
    const data = await res.json();
    if (typeof data.reply !== 'string' || typeof data.done !== 'boolean') {
      throw new Error('Invalid response shape from backend (need reply + done)');
    }
    state.apiLive = true;
    return data;
  } catch (err) {
    clearTimeout(timer);
    state.apiLive = false;
    throw err;
  }
}

function parseFinalEvaluation(text) {
  if (!text) return null;
  const out = {
    overall: null,
    strengths: [],
    weaknesses: [],
    technical: '',
    communication: '',
    recommendation: '',
  };
  const lines = text.split(/\r?\n/);
  let section = null;
  for (const raw of lines) {
    const line = raw.trim();
    if (!line) continue;
    if (/^OVERALL_SCORE:/i.test(line)) {
      const m = line.match(/OVERALL_SCORE:\s*([\d.]+)/i);
      if (m) out.overall = parseFloat(m[1]);
      section = null;
    } else if (/^STRENGTHS:/i.test(line)) {
      section = 'strengths';
    } else if (/^WEAKNESSES:/i.test(line)) {
      section = 'weaknesses';
    } else if (/^TECHNICAL_ASSESSMENT:/i.test(line)) {
      section = 'technical';
      const rest = line.replace(/^TECHNICAL_ASSESSMENT:\s*/i, '').trim();
      if (rest) out.technical += rest + ' ';
    } else if (/^COMMUNICATION_ASSESSMENT:/i.test(line)) {
      section = 'communication';
      const rest = line.replace(/^COMMUNICATION_ASSESSMENT:\s*/i, '').trim();
      if (rest) out.communication += rest + ' ';
    } else if (/^RECOMMENDATION:/i.test(line)) {
      section = 'recommendation';
      const rest = line.replace(/^RECOMMENDATION:\s*/i, '').trim();
      if (rest) out.recommendation += rest + ' ';
    } else if (section === 'strengths' && line.startsWith('-')) {
      out.strengths.push(line.replace(/^-\s*/, ''));
    } else if (section === 'weaknesses' && line.startsWith('-')) {
      out.weaknesses.push(line.replace(/^-\s*/, ''));
    } else if (section === 'technical') {
      out.technical += line + ' ';
    } else if (section === 'communication') {
      out.communication += line + ' ';
    } else if (section === 'recommendation') {
      out.recommendation += line + ' ';
    }
  }
  out.technical = out.technical.trim();
  out.communication = out.communication.trim();
  out.recommendation = out.recommendation.trim();
  return out;
}

async function startInterview() {
  if (!state.selectedCandidate) return;
  state.sessionId = uid();
  state.messages = [];
  state.questionNumber = 0;
  state.curriculumDay = null;
  state.lastScore = null;
  state.lastFeedback = null;
  state.done = false;
  state.finalEvaluationRaw = null;
  state.finalParsed = null;
  state.historyScores = [];
  state.error = null;
  state.loading = true;
  state.loadingStatus = 'Preparing first question';
  state.view = 'interview';
  state.mobileSideOpen = false;
  render();

  try {
    const data = await callInterview({
      sessionId: state.sessionId,
      candidate: { member: { id: state.selectedCandidate.id } },
    });
    state.questionNumber = data.question_number || 1;
    state.curriculumDay = data.curriculum_day ?? null;
    state.messages.push({ role: 'bot', text: data.reply });
    if (data.done) finishWith(data);
  } catch (err) {
    state.error = err.message || String(err);
    state.messages.push({ role: 'system', text: 'Failed to start interview: ' + state.error });
  } finally {
    state.loading = false;
    state.loadingStatus = '';
    render();
    scrollChat();
  }
}

async function sendAnswer() {
  const ta = document.getElementById('answer-input');
  if (!ta) return;
  const text = ta.value.trim();
  if (!text || state.loading || state.done) return;

  state.messages.push({ role: 'user', text });
  ta.value = '';
  state.loading = true;
  state.loadingStatus = 'Evaluating response';
  state.error = null;
  render();
  scrollChat();

  try {
    const data = await callInterview({
      sessionId: state.sessionId,
      message: text,
    });

    if (data.score != null) {
      state.lastScore = data.score;
      state.historyScores.push(data.score);
    }
    if (data.feedback) {
      state.lastFeedback = data.feedback;
      state.messages.push({
        role: 'meta',
        text: `Score: ${data.score != null ? data.score + '/10' : '—'}  ·  ${data.feedback}`,
      });
    }
    if (data.question_number != null) state.questionNumber = data.question_number;
    if (data.curriculum_day != null) state.curriculumDay = data.curriculum_day;

    if (data.done) {
      finishWith(data);
    } else {
      state.loadingStatus = 'Selecting next question';
      render();
      state.messages.push({ role: 'bot', text: data.reply });
    }
  } catch (err) {
    state.error = err.message || String(err);
    state.messages.push({ role: 'system', text: 'Error: ' + state.error });
  } finally {
    state.loading = false;
    state.loadingStatus = '';
    render();
    scrollChat();
  }
}

function finishWith(data) {
  state.done = true;
  state.finalEvaluationRaw = data.final_evaluation || '';
  state.finalParsed = parseFinalEvaluation(state.finalEvaluationRaw);
  if (data.score != null) state.lastScore = data.score;
  if (data.feedback) state.lastFeedback = data.feedback;
  state.messages.push({ role: 'bot', text: data.reply || 'Interview completed.' });
  state.messages.push({ role: 'system', text: 'Interview finished. Opening report…' });
  setTimeout(() => {
    state.view = 'report';
    render();
  }, 900);
}

function scrollChat() {
  requestAnimationFrame(() => {
    const el = document.getElementById('chat-messages');
    if (el) el.scrollTop = el.scrollHeight;
  });
}

function progressDots() {
  const answered = state.historyScores.length;
  const qn = state.questionNumber || 1;
  const total = Math.max(8, answered + (state.done ? 0 : 1));
  let html = '';
  for (let i = 1; i <= total; i++) {
    let cls = 'pending';
    if (i <= answered) cls = 'done';
    else if (i === answered + 1 && !state.done) cls = 'current';
    html += `<span class="${cls}"></span>`;
  }
  return html;
}

function scoreColor(s) {
  if (s >= 8) return 'var(--success)';
  if (s >= 5) return 'var(--warning)';
  return 'var(--error)';
}

function verdict(overall) {
  if (overall == null) return { label: '', cls: '' };
  if (overall >= 8) return { label: 'Strong Candidate', cls: 'strong' };
  if (overall >= 5.5) return { label: 'Moderate Fit', cls: 'moderate' };
  return { label: 'Needs Development', cls: 'develop' };
}

              <div class="ai-status">${esc(status)}</div>` : ''}
          </div>

          <div class="card">
            <div class="side-label">Score History</div>
            ${state.historyScores.length === 0
              ? '<p class="muted" style="font-size:12px">Scores appear after each answer.</p>'
              : state.historyScores.map((s,i) => `
                  <div class="stat-row"><span>Q${i+1}</span><strong style="color:${scoreColor(s)}">${s}/10</strong></div>`).join('')}
          </div>

          ${state.lastFeedback ? `
            <div class="card">
              <div class="side-label">Last Feedback</div>
              <p style="font-size:13px;line-height:1.5;color:var(--text-secondary)">${esc(state.lastFeedback)}</p>
            </div>` : ''}
        </div>
      </div>
    </div>`;
}

function renderReport() {
  const p = state.finalParsed || {};
  const overall = p.overall != null ? p.overall : (state.lastScore != null ? state.lastScore : null);
  const v = verdict(overall);
  const c = state.selectedCandidate;

  return `
    ${navBar('report')}
    <div class="page page-enter">
      <div class="report-hero">
        <div class="side-label" style="margin-bottom:8px">Candidate Intelligence Report</div>
        <div style="font-size:18px;font-weight:700;letter-spacing:-0.02em;margin-bottom:4px">${esc(c?.name || '')}</div>
        <div class="muted" style="font-size:13px;margin-bottom:20px">${esc(c?.jobRole || '')} · ${esc(c?.id || '')}</div>

        <div class="score-ring-wrap">
          <canvas id="score-ring"></canvas>
          <div class="score-center">
            <strong>${overall != null ? overall.toFixed(1) : '—'}</strong>
            <span>/ 10</span>
          </div>
        </div>
        <div style="font-size:12px;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);margin-top:4px">AI Interview Score</div>
        ${v.label ? `<div class="report-verdict ${v.cls}">${v.label}</div>` : ''}
        <div style="margin-top:14px">${liveBadge()}</div>
      </div>

      <div class="report-grid">
        <div class="card list-block strengths reveal reveal-delay-1">
          <div class="section-title">Strengths</div>
          <ul>${(p.strengths && p.strengths.length) ? p.strengths.map(s => `<li>${esc(s)}</li>`).join('') : '<li class="muted">—</li>'}</ul>
        </div>
        <div class="card list-block weaknesses reveal reveal-delay-2">
          <div class="section-title">Gaps</div>
          <ul>${(p.weaknesses && p.weaknesses.length) ? p.weaknesses.map(s => `<li>${esc(s)}</li>`).join('') : '<li class="muted">—</li>'}</ul>
        </div>
      </div>

      <div class="report-grid">
        <div class="card reveal reveal-delay-1">
          <div class="section-title">Technical Assessment</div>
          <p class="para">${esc(p.technical || '—')}</p>
        </div>
        <div class="card reveal reveal-delay-2">
          <div class="section-title">Communication Assessment</div>
          <p class="para">${esc(p.communication || '—')}</p>
        </div>
      </div>

      <div class="card reveal reveal-delay-3" style="margin-bottom:14px">
        <div class="section-title">Recommendation</div>
        <p class="para">${esc(p.recommendation || '—')}</p>
      </div>

      ${state.historyScores.length ? `
        <div class="card" style="margin-bottom:14px">
          <div class="section-title" style="margin-bottom:12px">Question-by-Question Scores</div>
          <canvas id="score-bars" height="120"></canvas>
        </div>` : ''}

      <details class="card developer-details">
        <summary>Developer Details</summary>
        <pre>${esc(state.finalEvaluationRaw || '')}</pre>
      </details>

      <div class="report-actions">
        <button class="btn-primary btn-cta" data-action="download-report">Download Report <span class="cta-arrow">↓</span></button>
        <button class="btn-ghost" data-action="start-interview">Retake Interview</button>
        <button class="btn-ghost" data-action="go-dashboard">Back to Candidates</button>
      </div>
    </div>`;
}

function esc(s) {
  return String(s ?? '')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

function loadingOverlayHtml() {
  if (!state.loading || state.view !== 'interview') return '';
  // Only full overlay when starting (no messages yet) — otherwise chat thinking row is enough
  if (state.messages.length > 0) return '';
  return `
    <div class="loading-overlay" id="loading-overlay">
      <div class="loading-orb"></div>
      <div class="loading-text">${esc(state.loadingStatus || 'Starting interview…')}</div>
      <div class="loading-sub">Connecting to AI engine</div>
      <div class="loading-bar"><span></span></div>
    </div>`;
}

function initScrollReveals() {
  const nodes = document.querySelectorAll('.reveal');
  if (!nodes.length) return;
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    nodes.forEach(n => n.classList.add('visible'));
    return;
  }
  const io = new IntersectionObserver((entries) => {
    entries.forEach(e => {
      if (e.isIntersecting) {
        e.target.classList.add('visible');
        io.unobserve(e.target);
      }
    });
  }, { threshold: 0.12, rootMargin: '0px 0px -40px 0px' });
  nodes.forEach(n => io.observe(n));
}

function updateScrollProgress() {
  const bar = document.getElementById('scroll-progress');
  if (!bar) return;
  const doc = document.documentElement;
  const scrollTop = doc.scrollTop || document.body.scrollTop;
  const height = doc.scrollHeight - doc.clientHeight;
  const pct = height > 0 ? (scrollTop / height) * 100 : 0;
  bar.style.width = pct + '%';
}

function render() {
  const root = document.getElementById('app');
  let html = '';
  if (state.view === 'landing') html = renderLanding();
  else if (state.view === 'dashboard') html = renderDashboard();
  else if (state.view === 'curriculum') html = renderCurriculum();
  else if (state.view === 'interview') html = renderInterview();
  else if (state.view === 'report') html = renderReport();
  root.innerHTML = html + loadingOverlayHtml();

  // Keep page clear of fixed bottom dock when a candidate is selected
  document.body.classList.toggle(
    'has-selected-dock',
    state.view === 'dashboard' && !!state.selectedCandidate
  );

  initScrollReveals();
  updateScrollProgress();

  if (state.view === 'report') {
    requestAnimationFrame(() => {
      const ring = document.getElementById('score-ring');
      if (ring && window.Chart) {
        const overall = (state.finalParsed && state.finalParsed.overall != null)
          ? state.finalParsed.overall
          : (state.lastScore != null ? state.lastScore : 0);
        const pct = Math.min(10, Math.max(0, overall)) / 10;
        new Chart(ring, {
          type: 'doughnut',
          data: {
            datasets: [{
              data: [pct, 1 - pct],
              backgroundColor: [
                getComputedStyle(document.documentElement).getPropertyValue('--primary').trim() || '#7C5CFF',
                getComputedStyle(document.documentElement).getPropertyValue('--chart-track').trim() || 'rgba(255,255,255,0.06)'
              ],
              borderWidth: 0,
            }],
          },
          options: {
            cutout: '80%',
            plugins: { legend: { display: false }, tooltip: { enabled: false } },
            animation: { animateRotate: true, duration: 900 },
          },
        });
      }
      const bars = document.getElementById('score-bars');
      if (bars && window.Chart && state.historyScores.length) {
        const tickColor = getComputedStyle(document.documentElement).getPropertyValue('--muted').trim() || '#64748B';
        const gridColor = getComputedStyle(document.documentElement).getPropertyValue('--chart-grid').trim() || 'rgba(255,255,255,0.04)';
        new Chart(bars, {
          type: 'bar',
          data: {
            labels: state.historyScores.map((_, i) => 'Q' + (i + 1)),
            datasets: [{
              data: state.historyScores,
              backgroundColor: state.historyScores.map(s =>
                s >= 8 ? '#34D399' : s >= 5 ? '#FBBF24' : '#FB7185'),
              borderRadius: 6,
              borderSkipped: false,
            }],
          },
          options: {
            scales: {
              y: {
                min: 0, max: 10,
                ticks: { color: tickColor, stepSize: 2 },
                grid: { color: gridColor },
                border: { display: false },
              },
              x: {
                ticks: { color: tickColor },
                grid: { display: false },
                border: { display: false },
              },
            },
            plugins: { legend: { display: false } },
          },
        });
      }
    });
  }

  if (state.view === 'interview' && !state.loading && !state.done) {
    const ta = document.getElementById('answer-input');
    if (ta) ta.focus();
  }
}

// ============================================================
// EVENTS
// ============================================================
document.addEventListener('click', (e) => {
  const btn = e.target.closest('[data-action]');
  if (!btn) return;
  const action = btn.dataset.action;

  if (action === 'go-landing') { state.view = 'landing'; render(); }
  else if (action === 'go-dashboard') { state.view = 'dashboard'; render(); }
  else if (action === 'go-curriculum') { state.view = 'curriculum'; render(); }
  else if (action === 'scroll-how') {
    document.getElementById('how-it-works')?.scrollIntoView({ behavior: 'smooth' });
  }
  else if (action === 'select-cand') {
    // Ignore clicks on the Start button inside the card (handled separately)
    if (e.target.closest('[data-action="start-interview"]')) return;
    const id = btn.dataset.id;
    state.selectedCandidate = CANDIDATES.find(c => c.id === id) || null;
    render();
    // Keep the selected card visible; the fixed dock shows Start Interview
    requestAnimationFrame(() => {
      const card = document.querySelector('.cand-card.selected');
      if (card) {
        card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    });
  }
  else if (action === 'start-interview') {
    startInterview();
  }
  else if (action === 'send-answer') {
    sendAnswer();
  }
  else if (action === 'retry-last') {
    state.error = null;
    render();
  }
  else if (action === 'toggle-mobile-side') {
    state.mobileSideOpen = !state.mobileSideOpen;
    render();
  }
  else if (action === 'toggle-theme') {
    applyTheme(state.theme === 'dark' ? 'light' : 'dark');
    render();
  }
  else if (action === 'save-api-base') {
    const inp = document.getElementById('api-base-input');
    if (inp) {
      window.__API_BASE_URL = inp.value.trim().replace(/\/$/, '');
      alert('Base URL saved for this session: ' + (inp.value.trim() || '(same origin)'));
    }
  }
  else if (action === 'download-report') {
    const p = state.finalParsed || {};
    const lines = [
      'AI Interview Report',
      'Candidate: ' + (state.selectedCandidate?.name || '') + ' (' + (state.selectedCandidate?.id || '') + ')',
      'Overall score: ' + (p.overall != null ? p.overall : '—') + '/10',
      '',
      'STRENGTHS:',
      ...(p.strengths || []).map(s => '- ' + s),
      '',
      'WEAKNESSES:',
      ...(p.weaknesses || []).map(s => '- ' + s),
      '',
      'TECHNICAL ASSESSMENT:',
      p.technical || '—',
      '',
      'COMMUNICATION ASSESSMENT:',
      p.communication || '—',
      '',
      'RECOMMENDATION:',
      p.recommendation || '—',
      '',
      '--- Raw ---',
      state.finalEvaluationRaw || '',
    ];
    const blob = new Blob([lines.join('\n')], { type: 'text/plain' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'interview-report-' + (state.selectedCandidate?.id || 'unknown') + '.txt';
    a.click();
  }
});

document.addEventListener('input', (e) => {
  if (e.target.id === 'cand-search') render();
});

document.addEventListener('keydown', (e) => {
  if (e.target.id === 'answer-input' && e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendAnswer();
  }
});

window.addEventListener('scroll', updateScrollProgress, { passive: true });
window.addEventListener('resize', updateScrollProgress, { passive: true });

render();

// Initial site boot splash — show on first open, then fade out
(function dismissBootSplash() {
  const splash = document.getElementById('boot-splash');
  if (!splash) return;
  const minMs = 1200;
  const start = performance.now();
  function hide() {
    const wait = Math.max(0, minMs - (performance.now() - start));
    setTimeout(() => {
      splash.classList.add('is-done');
      splash.setAttribute('aria-busy', 'false');
      setTimeout(() => splash.remove(), 600);
    }, wait);
  }
  if (document.readyState === 'complete') hide();
  else window.addEventListener('load', hide);
})();
</script>
</body>
</html>
