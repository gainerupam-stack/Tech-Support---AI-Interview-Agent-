<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Interview Agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
:root{
  --bg:#F6F5FB; --surface:#FFFFFF; --surface-2:#F0EDFB; --surface-3:#E8E3FA;
  --ink:#151221; --ink-soft:#69637F; --ink-faint:#9A94AE;
  --primary:#6C3BFF; --primary-light:#8A5CFF; --primary-dark:#4C1FD6;
  --accent:#17C3B2; --good:#16A34A; --good-bg:#EAFBF0; --warn:#D97706; --warn-bg:#FFF6E5; --bad:#DC2626; --bad-bg:#FEECEC;
  --border:#E7E3F5;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:'Inter',-apple-system,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;}
h1,h2,h3,.brand-text{font-family:'Sora',sans-serif;}
.mono{font-family:'JetBrains Mono',monospace;}
.muted{color:var(--ink-soft);}
.small{font-size:12px;}
.push-right{margin-left:auto;}
button{font-family:inherit;}
input,textarea{font-family:inherit;}

.btn{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:14px;border-radius:12px;border:none;cursor:pointer;padding:10px 16px;transition:transform .15s ease, box-shadow .15s ease, opacity .15s ease; background:var(--surface); color:var(--ink);}
.btn:active{transform:scale(0.97);}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.btn-primary{background:linear-gradient(135deg,var(--primary) 0%,var(--primary-light) 100%);color:#fff;box-shadow:0 8px 20px -6px rgba(108,59,255,.5);}
.btn-primary:hover:not(:disabled){box-shadow:0 10px 26px -6px rgba(108,59,255,.65);}
.btn-ghost{background:var(--surface);color:var(--ink);border:1px solid var(--border);}
.btn-ghost:hover{border-color:var(--primary-light);}
.btn-lg{padding:13px 22px;font-size:15px;border-radius:14px;}
.btn-sm{padding:7px 12px;font-size:13px;border-radius:10px;}
.btn-block{width:100%;justify-content:center;}

.page{width:100%;max-width:1180px;margin:0 auto;padding:0 24px 80px;}
.nav{display:flex;align-items:center;justify-content:space-between;padding:22px 0;gap:12px;flex-wrap:wrap;}
.nav-links{display:flex;gap:8px;font-size:14px;color:var(--ink-soft);font-weight:500;}
.nav-links button{background:none;border:none;font-family:inherit;font-size:14px;font-weight:500;color:var(--ink-soft);cursor:pointer;padding:8px 12px;border-radius:10px;transition:all .15s ease;}
.nav-links button:hover{color:var(--primary);background:var(--surface-2);}
.nav-links button.active{color:var(--primary);background:var(--surface-2);}
.brand-btn{background:none;border:none;cursor:pointer;padding:0;}
.brand{display:flex;align-items:center;gap:10px;}
.brand-text{font-weight:700;font-size:16px;letter-spacing:-.01em;}

.mode-badge{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;padding:5px 11px;border-radius:999px;letter-spacing:.02em;cursor:default;}
.mode-live{background:var(--good-bg);color:var(--good);}
.mode-demo{background:var(--warn-bg);color:var(--warn);}
.mode-bad{background:var(--bad-bg);color:var(--bad);}
.mode-dot{width:6px;height:6px;border-radius:50%;background:currentColor;}
.mode-dot.spin{animation:dot-blink 1s ease-in-out infinite;}
@keyframes dot-blink{0%,100%{opacity:1;}50%{opacity:.25;}}

.orb{position:relative;border-radius:50%;flex-shrink:0;}
.orb::before{content:'';position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,var(--primary),var(--accent),var(--primary-light),var(--primary));animation:orb-spin 6s linear infinite;filter:blur(.5px);}
.orb-core{position:absolute;inset:3px;border-radius:50%;background:radial-gradient(circle at 32% 28%,#fff 0%,var(--primary-light) 38%,var(--primary) 100%);}
.orb-active::before{animation-duration:1.4s;}
.orb-active{animation:orb-pulse 1.6s ease-out infinite;}
@keyframes orb-spin{to{transform:rotate(360deg);}}
@keyframes orb-pulse{0%{box-shadow:0 0 0 0 rgba(108,59,255,.45);}70%{box-shadow:0 0 0 14px rgba(108,59,255,0);}100%{box-shadow:0 0 0 0 rgba(108,59,255,0);}}

.hero{position:relative;padding-top:20px;overflow:hidden;border-radius:28px;}
.hero-blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:.45;z-index:0;}
.hero-blob-a{width:360px;height:360px;background:var(--primary-light);top:-120px;right:-80px;animation:float-a 12s ease-in-out infinite;}
.hero-blob-b{width:280px;height:280px;background:var(--accent);top:120px;left:-100px;opacity:.25;animation:float-b 14s ease-in-out infinite;}
@keyframes float-a{0%,100%{transform:translate(0,0);}50%{transform:translate(-30px,30px);}}
@keyframes float-b{0%,100%{transform:translate(0,0);}50%{transform:translate(20px,-20px);}}
.hero-content{position:relative;z-index:1;text-align:center;max-width:640px;margin:60px auto 40px;}
.eyebrow{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--primary-dark);background:var(--surface-2);padding:6px 12px;border-radius:999px;margin-bottom:20px;}
.hero-title{font-size:56px;font-weight:800;letter-spacing:-.03em;line-height:1.05;margin:0 0 16px;}
.hero-sub{font-size:17px;color:var(--ink-soft);line-height:1.6;margin:0 0 30px;}
.hero-ctas{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}
.hero-orb-stage{display:flex;justify-content:center;padding-bottom:40px;position:relative;z-index:1;}

.section{padding:60px 0 20px;}
.section-head{text-align:center;margin-bottom:36px;}
.section-kicker{font-size:12px;font-weight:700;color:var(--primary);letter-spacing:.08em;text-transform:uppercase;}
.section-head h2{font-size:30px;font-weight:700;letter-spacing:-.02em;margin:6px 0 0;}
.feature-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;}
.feature-card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:22px;animation:rise .5s ease both;}
.feature-card:hover{border-color:var(--primary-light);transform:translateY(-2px);transition:all .2s ease;}
.feature-icon{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--surface-2);color:var(--primary);margin-bottom:14px;font-size:18px;}
.feature-card h3{font-size:15px;margin:0 0 6px;}
.feature-card p{font-size:13px;color:var(--ink-soft);margin:0;line-height:1.5;}
.steps-row{display:flex;gap:4px;flex-wrap:wrap;}
.step-item{flex:1;min-width:150px;position:relative;padding-right:16px;animation:rise .5s ease both;}
.step-num{font-family:'Sora',sans-serif;font-weight:700;font-size:20px;color:var(--primary-light);margin-bottom:10px;}
.step-body{font-size:13.5px;font-weight:500;line-height:1.4;}
.cta-band{margin-top:50px;background:linear-gradient(135deg,var(--primary) 0%,var(--primary-dark) 100%);border-radius:24px;padding:40px 44px;display:flex;align-items:center;justify-content:space-between;color:#fff;gap:20px;flex-wrap:wrap;}
.cta-band h2{margin:0 0 6px;font-size:24px;}
.cta-band p{margin:0;opacity:.85;font-size:14px;}
.cta-band .btn-primary{background:#fff;color:var(--primary-dark);box-shadow:none;}
@keyframes rise{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}

.card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:22px;}

.dash-page{padding-top:8px;}
.config-card{margin-bottom:18px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;}
.config-card .cc-left{display:flex;align-items:center;gap:12px;}
.config-card code{background:var(--surface-2);padding:4px 8px;border-radius:8px;font-size:12.5px;}

.dash-toolbar{display:flex;gap:12px;align-items:center;margin-bottom:18px;flex-wrap:wrap;}
.search-input{flex:1;min-width:220px;padding:11px 14px;border-radius:12px;border:1px solid var(--border);background:var(--surface);font-size:14px;outline:none;}
.search-input:focus{border-color:var(--primary-light);}
.text-input{padding:11px 14px;border-radius:12px;border:1px solid var(--border);background:var(--surface);font-size:14px;outline:none;width:100%;}
.text-input:focus{border-color:var(--primary-light);}
.field-label{font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;display:block;}
.field{margin-bottom:14px;}

.candidate-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-bottom:22px;}
.candidate-pick{background:var(--surface);border:1.5px solid var(--border);border-radius:16px;padding:14px 16px;cursor:pointer;transition:all .15s ease;text-align:left;}
.candidate-pick:hover{border-color:var(--primary-light);transform:translateY(-2px);}
.candidate-pick.selected{border-color:var(--primary);background:var(--surface-2);}
.candidate-pick .cname{font-weight:700;font-size:14px;margin-bottom:2px;}
.candidate-pick .crole{font-size:12px;color:var(--ink-soft);}

.notice{border-radius:14px;padding:14px 16px;font-size:13.5px;line-height:1.5;margin-bottom:18px;}
.notice-warn{background:var(--warn-bg);color:#7c3d02;}
.notice-bad{background:var(--bad-bg);color:#7f1d1d;}
.notice code{background:rgba(0,0,0,0.06);padding:1px 6px;border-radius:6px;}

.manual-card{margin-bottom:18px;}
.manual-card h3{margin:0 0 4px;font-size:15px;}
.manual-card .muted{margin-bottom:16px;display:block;font-size:13px;}
.manual-row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;}
.manual-row .field{flex:1;min-width:160px;margin-bottom:0;}

.selected-card{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;}
.selected-left{display:flex;align-items:center;gap:14px;}
.avatar{width:52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--primary),var(--primary-light));color:#fff;font-weight:700;font-family:'Sora',sans-serif;flex-shrink:0;}
.selected-card h3{margin:0;font-size:16px;}
.raw-toggle{font-size:12px;color:var(--primary);cursor:pointer;text-decoration:underline;background:none;border:none;padding:0;margin-top:4px;}
.raw-json{margin-top:12px;background:var(--surface-2);border-radius:12px;padding:12px 14px;font-size:11.5px;white-space:pre-wrap;word-break:break-all;max-height:220px;overflow:auto;}

/* interview shell */
.interview-shell{display:grid;grid-template-columns:250px 1fr 250px;height:100vh;width:100%;}
.side{padding:20px 16px;overflow-y:auto;display:flex;flex-direction:column;gap:14px;}
.side-left{background:var(--surface);border-right:1px solid var(--border);}
.side-right{background:var(--surface);border-left:1px solid var(--border);}
.back-btn{align-self:flex-start;}
.side-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-faint);margin-top:6px;}
.bar1d-track{height:7px;background:var(--surface-2);border-radius:999px;overflow:hidden;}
.bar1d-fill{height:100%;border-radius:999px;transition:width .5s ease;display:block;}
.bar1d-primary{background:linear-gradient(90deg,var(--primary),var(--primary-light));}
.bar1d-teal{background:linear-gradient(90deg,var(--accent),#4fd8c9);}
.side-stat-list{display:flex;flex-direction:column;gap:10px;}
.side-stat{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-soft);}
.status-pill{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;padding:7px 12px;border-radius:999px;width:fit-content;}
.status-pill.good{color:var(--good);background:var(--good-bg);}
.status-pill.bad{color:var(--bad);background:var(--bad-bg);}
.status-dot{width:7px;height:7px;border-radius:50%;background:currentColor;}

.chat-col{display:flex;flex-direction:column;background:var(--bg);min-width:0;}
.chat-header{display:flex;align-items:center;gap:12px;padding:16px 24px;border-bottom:1px solid var(--border);background:var(--surface);}
.chat-header-title{font-weight:700;font-size:14.5px;font-family:'Sora',sans-serif;}
.chat-header-sub{font-size:12px;color:var(--ink-faint);}
.chat-scroll{flex:1;overflow-y:auto;padding:24px;display:flex;flex-direction:column;gap:16px;}
.msg-row{display:flex;gap:10px;max-width:720px;animation:rise .35s ease both;}
.msg-row-user{align-self:flex-end;flex-direction:row-reverse;}
.bubble{border-radius:18px;padding:14px 16px;font-size:14.5px;line-height:1.55;position:relative;}
.bubble p{margin:0;white-space:pre-wrap;}
.bubble-ai{background:var(--surface);border:1px solid var(--border);border-top-left-radius:6px;}
.bubble-user{background:linear-gradient(135deg,var(--primary),var(--primary-light));color:#fff;border-top-right-radius:6px;}
.bubble-system{background:var(--surface-2);color:var(--ink-soft);font-style:italic;font-size:13px;}
.bubble-error{background:var(--bad-bg);color:#7f1d1d;border:1px solid #f3b4b4;}
.bubble-error .btn{margin-top:8px;}
.bubble-thinking{display:flex;align-items:center;gap:10px;}
.followup-badge,.difficulty-badge,.topic-badge{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.02em;padding:3px 9px;border-radius:999px;margin:0 6px 8px 0;}
.followup-badge{background:#FFF0E0;color:#C2620A;animation:badge-pulse 1.8s ease-in-out infinite;}
.difficulty-badge{background:var(--surface-2);color:var(--primary-dark);}
.topic-badge{background:var(--surface-3);color:var(--ink-soft);}
@keyframes badge-pulse{0%,100%{box-shadow:0 0 0 0 rgba(194,98,10,.25);}50%{box-shadow:0 0 0 5px rgba(194,98,10,0);}}
.thinking-dots{display:inline-flex;gap:4px;}
.thinking-dots i{width:6px;height:6px;border-radius:50%;background:var(--primary-light);display:inline-block;animation:dot-bounce 1.2s infinite ease-in-out;}
.thinking-dots i:nth-child(2){animation-delay:.15s;}
.thinking-dots i:nth-child(3){animation-delay:.3s;}
@keyframes dot-bounce{0%,80%,100%{transform:translateY(0);opacity:.5;}40%{transform:translateY(-4px);opacity:1;}}
.thinking-text{font-size:13px;color:var(--ink-soft);}
.composer{display:flex;align-items:flex-end;gap:8px;padding:16px 24px;border-top:1px solid var(--border);background:var(--surface);}
.composer-input{flex:1;resize:none;border:1px solid var(--border);border-radius:14px;padding:12px 14px;font-family:'Inter',sans-serif;font-size:14px;max-height:120px;outline:none;background:var(--bg);}
.composer-input:focus{border-color:var(--primary-light);}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--border);background:var(--surface);display:flex;align-items:center;justify-content:center;color:var(--ink-soft);cursor:pointer;flex-shrink:0;font-size:16px;}
.icon-btn:hover{border-color:var(--primary-light);color:var(--primary);}
.send-btn{width:44px;height:40px;padding:0;justify-content:center;flex-shrink:0;}

.report-page{padding-top:8px;}
.report-hero{text-align:center;padding:30px 0 10px;display:flex;flex-direction:column;align-items:center;gap:10px;}
.report-hero h1{font-size:34px;margin:0;}
.score-ring-wrap{position:relative;margin-top:10px;}
.score-ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.score-ring-value{font-family:'Sora',sans-serif;font-size:44px;font-weight:800;}
.score-ring-label{font-size:12px;color:var(--ink-soft);font-weight:600;}
.score-ring-sub{font-size:11px;color:var(--ink-faint);}
.report-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:30px;}
.cat-card{padding:16px 18px;}
.cat-head{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;margin-bottom:10px;}
.chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px;}
.chart-card h3{margin:0 0 12px;font-size:15px;}
.sw-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:30px;}
.sw-head{display:flex;align-items:center;gap:8px;font-size:15px;margin:0 0 12px;}
.sw-head-good{color:var(--good);}
.sw-head-warn{color:var(--warn);}
.sw-card{border-radius:14px;padding:13px 16px;font-size:13.5px;margin-bottom:10px;line-height:1.4;}
.sw-good{background:var(--good-bg);color:#14532d;}
.sw-warn{background:var(--warn-bg);color:#7c3d02;}
.summary-card{margin-top:26px;font-size:14px;line-height:1.6;}
.reco-card{margin-top:26px;}
.reco-card h3{margin:0 0 16px;font-size:16px;}
.reco-list{display:flex;flex-direction:column;gap:16px;}
.reco-item{display:flex;gap:14px;}
.reco-num{width:28px;height:28px;border-radius:10px;background:var(--surface-2);color:var(--primary);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0;font-family:'Sora',sans-serif;}
.reco-title{font-weight:700;font-size:14px;margin-bottom:2px;}
.report-actions{display:flex;justify-content:center;gap:12px;margin-top:36px;flex-wrap:wrap;}

.empty-state{text-align:center;padding:60px 20px;color:var(--ink-soft);}
.spinner{width:22px;height:22px;border-radius:50%;border:3px solid var(--surface-2);border-top-color:var(--primary);animation:spin .7s linear infinite;margin:0 auto 14px;}
@keyframes spin{to{transform:rotate(360deg);}}

/* curriculum */
.module-group{margin-bottom:26px;}
.module-group h3{font-size:15px;margin:0 0 14px;display:flex;align-items:center;gap:8px;}
.timeline{display:flex;flex-direction:column;}
.timeline-item{display:grid;grid-template-columns:26px 1fr;column-gap:12px;position:relative;padding-bottom:22px;animation:rise .5s ease both;}
.timeline-item:last-child{padding-bottom:0;}
.timeline-dot{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;z-index:1;color:#fff;font-size:11px;font-weight:700;font-family:'Sora',sans-serif;background:linear-gradient(135deg,var(--primary),var(--primary-light));flex-shrink:0;}
.timeline-line{position:absolute;left:12px;top:26px;bottom:-2px;width:2px;background:var(--border);}
.timeline-item:last-child .timeline-line{display:none;}
.timeline-day{font-size:11px;color:var(--ink-faint);font-weight:600;}
.timeline-topic{font-size:14px;font-weight:600;margin:2px 0 4px;}
.timeline-desc{font-size:12.5px;color:var(--ink-soft);line-height:1.5;}

@media (max-width:980px){
  .feature-grid{grid-template-columns:repeat(2,1fr);}
  .interview-shell{grid-template-columns:1fr;grid-template-rows:auto auto 1fr auto;height:auto;min-height:100vh;}
  .side-left,.side-right{flex-direction:row;flex-wrap:wrap;border:none;border-bottom:1px solid var(--border);}
  .report-grid,.chart-grid,.sw-grid{grid-template-columns:1fr;}
  .hero-title{font-size:38px;}
}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============================================================================
   BACKEND CONFIG
   This frontend has NO embedded candidate/curriculum/mock data. Everything —
   candidate profiles, interview questions, and the feedback report — comes
   from your backend. Adjust these two lines to match your backend:
   ============================================================================ */
const API_BASE_URL = '';              // e.g. 'http://localhost:8000' if backend is on a different origin. Leave '' if same origin.
const CANDIDATES_ENDPOINT = '/api/candidates'; // optional endpoint returning a list of candidates. If your backend doesn't have one, leave as-is — the UI falls back to a manual "enter candidate ID" form automatically.
const CURRICULUM_ENDPOINT = '/api/curriculum'; // optional endpoint returning curriculum days/modules. If your backend doesn't have one, the Curriculum page shows a clear notice instead of guessing.
const INTERVIEW_ENDPOINT = '/api/interview';   // per technical-spec.md

/* ============================================================================
   ICONS (inline SVG, no deps)
   ============================================================================ */
const ICON = {
  sparkles: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2 2M16 16l2 2M6 18l2-2M16 8l2-2"/></svg>',

/* ============================================================================
   API LAYER — talks to your real backend only. No local mock fallback.
   ============================================================================ */

async function apiPost(path, payload, timeoutMs){
  const controller = new AbortController();
  const t = setTimeout(() => controller.abort(), timeoutMs || 15000);
  try{
    const res = await fetch(API_BASE_URL + path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
      signal: controller.signal,
    });
    clearTimeout(t);
    if(!res.ok){
      let detail = '';
      try{ detail = await res.text(); }catch(e){}
      throw new Error('Backend returned ' + res.status + (detail ? (': ' + detail.slice(0,200)) : ''));
    }
    const data = await res.json();
    state.backendState = 'ok';
    return { ok: true, data };
  }catch(err){
    clearTimeout(t);
    state.backendState = 'error';
    return { ok: false, error: describeError(err) };
  }
}

async function apiGet(path, timeoutMs){
  const controller = new AbortController();
  const t = setTimeout(() => controller.abort(), timeoutMs || 8000);
  try{
    const res = await fetch(API_BASE_URL + path, { signal: controller.signal });
    clearTimeout(t);
    if(!res.ok) throw new Error('Backend returned ' + res.status);
    const data = await res.json();
    return { ok: true, data };
  }catch(err){
    clearTimeout(t);
    return { ok: false, error: describeError(err) };
  }
}

function describeError(err){
  if(err && err.name === 'AbortError') return 'Request timed out — backend did not respond.';
  if(err instanceof TypeError) return 'Could not reach backend (network error or CORS blocked). Check API_BASE_URL and that the backend is running.';
  return (err && err.message) || 'Unknown error';
}

/* Normalizes a /api/candidates response into a flat array, tolerant of a few
   common shapes: [...], {candidates:[...]}, {data:[...]} */
function normalizeCandidateList(data){
  if(Array.isArray(data)) return data;
  if(data && Array.isArray(data.candidates)) return data.candidates;
  if(data && Array.isArray(data.data)) return data.data;
  return [];
}

function candField(c, keys, fallback){
  for(const k of keys){
    const v = k.split('.').reduce((o,p)=> (o && o[p] !== undefined) ? o[p] : undefined, c);
    if(v !== undefined && v !== null && v !== '') return v;
  }
  return fallback;
}
function candId(c){ return candField(c, ['id','candidateId','member.id','_id'], ''); }
function candName(c){ return candField(c, ['name','member.name','fullName'], candId(c) || 'Unnamed candidate'); }
function candRole(c){ return candField(c, ['role','jobRole','member.jobRole','title'], ''); }

async function loadCandidates(){
  state.candidatesStatus = 'loading';
  render();
  const res = await apiGet(CANDIDATES_ENDPOINT);
  if(res.ok){
    const list = normalizeCandidateList(res.data);
    state.candidates = list;
    state.candidatesStatus = 'loaded';
  } else {
    state.candidates = [];
    state.candidatesStatus = 'unavailable';
    state.candidatesErrorMsg = res.error;
  }
  render();
}

function normalizeCurriculum(data){
  if(Array.isArray(data)) return { modules: [], days: data };
  if(data && (Array.isArray(data.days) || Array.isArray(data.modules))) return { modules: data.modules||[], days: data.days||[] };
  if(data && Array.isArray(data.data)) return { modules: [], days: data.data };
  return { modules: [], days: [] };
}

async function loadCurriculum(){
  state.curriculumStatus = 'loading';
  render();
  const res = await apiGet(CURRICULUM_ENDPOINT);
  if(res.ok){
    state.curriculumData = normalizeCurriculum(res.data);
    state.curriculumStatus = 'loaded';
  } else {
    state.curriculumData = { modules: [], days: [] };
    state.curriculumStatus = 'unavailable';
    state.curriculumErrorMsg = res.error;
  }
  render();
}

function renderCurriculum(){
  const { modules, days } = state.curriculumData;
  let body = '';

  if(state.curriculumStatus === 'loading'){
    body = '<div class="card empty-state"><div class="spinner"></div>Loading curriculum from ' + escapeHtml(CURRICULUM_ENDPOINT) + '…</div>';
  } else if(state.curriculumStatus === 'unavailable'){
    body = '<div class="notice notice-warn">' + ic('alert') + ' Couldn\'t load curriculum from <code>' + escapeHtml(CURRICULUM_ENDPOINT) + '</code> (' + escapeHtml(state.curriculumErrorMsg) + '). ' +
      'That\'s fine if your backend doesn\'t expose that route — the interview itself doesn\'t need it, this page is just a browse view. ' +
      '<button class="btn btn-ghost btn-sm" data-action="reload-curriculum" style="margin-top:8px;">' + ic('refresh') + ' Retry</button></div>';
  } else if(state.curriculumStatus === 'loaded' && !days.length && !modules.length){
    body = '<div class="card empty-state">' + ic('compass') + '<p>Backend responded but returned no curriculum entries.</p></div>';
  } else if(state.curriculumStatus === 'loaded'){
    if(modules.length){
      body = modules.map(mod => {
        const modTitle = curField(mod, ['title','name','module'], 'Module');
        const modDays = Array.isArray(mod.days) ? mod.days : days.filter(d => curField(d,['module','moduleId'],null) === curField(mod,['id','moduleId'],undefined));
        return '<div class="card module-group">' + ic('layers') + '<h3 style="display:inline-flex;align-items:center;gap:8px;">' + escapeHtml(modTitle) + '</h3>' +
          '<div class="timeline">' + modDays.map((d,i) => curriculumTimelineItem(d,i,modDays.length)).join('') + '</div>' +
        '</div>';
      }).join('');
    } else {
      body = '<div class="card"><div class="timeline">' + days.map((d,i) => curriculumTimelineItem(d,i,days.length)).join('') + '</div></div>';
    }
  }

  return '' +
  '<div class="page">' +
    navBar('curriculum') +
    '<div class="section-head" style="text-align:left;margin-bottom:24px;"><span class="section-kicker">Curriculum</span><h2>Cohort program</h2></div>' +
    body +
  '</div>';
}

function curField(obj, keys, fallback){
  if(!obj) return fallback;
  for(const k of keys){
    const v = k.split('.').reduce((o,p)=> (o && o[p] !== undefined) ? o[p] : undefined, obj);
    if(v !== undefined && v !== null && v !== '') return v;
  }
  return fallback;
}

function curriculumTimelineItem(d, i, total){
  const day = curField(d, ['day','number','id'], i+1);
  const title = curField(d, ['title','topic','name'], 'Untitled');
  const desc = curField(d, ['description','summary','objective'], '');
  return '<div class="timeline-item">' +
    '<div class="timeline-dot">' + escapeHtml(String(day)) + '</div>' +
    (i < total-1 ? '<div class="timeline-line"></div>' : '') +
    '<div><div class="timeline-day">Day ' + escapeHtml(String(day)) + '</div><div class="timeline-topic">' + escapeHtml(title) + '</div>' +
      (desc ? '<div class="timeline-desc">' + escapeHtml(desc) + '</div>' : '') +
    '</div>' +
  '</div>';
}

        '<div><div class="chat-header-title">Technical Interview — ' + escapeHtml(candName(c)) + '</div><div class="chat-header-sub">Session ' + escapeHtml(state.sessionId||'') + '</div></div>' +
      '</div>' +
      '<div class="chat-scroll" id="chat-scroll">' +
        state.messages.map(msg => renderMsg(msg)).join('') +
        (state.thinking ? ('<div class="msg-row">' + orb(26,true) + '<div class="bubble bubble-ai bubble-thinking"><span class="thinking-dots"><i></i><i></i><i></i></span><span class="thinking-text">Waiting on backend…</span></div></div>') : '') +
      '</div>' +
      '<div class="composer">' +
        '<button class="icon-btn" title="Attach (UI only)">' + ic('clip') + '</button>' +
        '<textarea class="composer-input" id="composer-input" placeholder="Type your answer… (Enter to send, Shift+Enter for new line)" rows="1" ' + (state.thinking||state.done?'disabled':'') + '></textarea>' +
        '<button class="icon-btn" title="Voice (UI only)">' + ic('mic') + '</button>' +
        '<button class="btn btn-primary send-btn" id="send-btn" ' + (state.thinking||state.done?'disabled':'') + '>' + ic('send') + '</button>' +
      '</div>' +
    '</main>' +

    '<aside class="side side-right">' +
      '<div class="side-title">Candidate</div>' +
      '<div class="side-stat-list">' +
        sideStat('message','Name', candName(c), true) +
        (candRole(c) ? sideStat('layers','Role', candRole(c), true) : '') +
        sideStat('git','Candidate ID', candId(c) || '—', true) +
      '</div>' +
      '<div class="side-title">Interview Status</div>' +
      (state.backendState === 'error'
        ? '<div class="status-pill bad"><span class="status-dot"></span> Backend error</div>'
        : '<div class="status-pill good"><span class="status-dot"></span> ' + (state.done ? 'Completed' : 'Active') + '</div>') +
    '</aside>' +
  '</div>';
}

function renderMsg(m){
  if(m.role === 'system'){
    return '<div class="msg-row"><div class="bubble bubble-system"><p>' + escapeHtml(m.text) + '</p></div></div>';
  }
  if(m.role === 'error'){
    return '<div class="msg-row"><div class="bubble bubble-error">' + ic('alert') + ' <p style="display:inline;">' + escapeHtml(m.text) + '</p>' +
      '<div><button class="btn btn-ghost btn-sm" data-action="retry-last">' + ic('refresh') + ' Retry</button></div></div></div>';
  }
  const isUser = m.role === 'user';
  return '<div class="msg-row ' + (isUser?'msg-row-user':'') + '">' +
    (isUser ? '' : orb(26,false)) +
    '<div class="bubble ' + (isUser?'bubble-user':'bubble-ai') + '">' +
      (!isUser && m.followUp ? '<span class="followup-badge">Follow-up Question</span>' : '') +
      (!isUser && !m.followUp && m.difficulty ? '<span class="difficulty-badge">' + escapeHtml(m.difficulty) + '</span>' : '') +
      (!isUser && m.topic ? '<span class="topic-badge">' + escapeHtml(m.topic) + '</span>' : '') +
      '<p>' + escapeHtml(m.text) + '</p>' +
    '</div>' +
  '</div>';
}

/* ============================================================================
   RENDER: REPORT — entirely driven by the backend's feedback object.
   Required by spec: summary, strengths[], gaps[], next[].
   Optional enhancements rendered only if present: overall/score (number),
   categories/scores (object of label->number).
   ============================================================================ */

function renderReport(){
  const c = state.selectedCandidate;
  const fb = state.feedback;
  if(!c || !fb){
    return '<div class="page"><div class="empty-state">' + ic('compass') + '<p>No feedback available yet.</p><button class="btn btn-primary" data-action="go-dashboard">Back to Dashboard</button></div></div>';
  }

  const overall = firstDefined(fb.overall, fb.score, fb.overallScore);
  const categories = fb.categories || fb.scores || null;

  let scoreBlock = '';
  if(overall != null){
    scoreBlock = scoreRingSvg(Math.round(overall), 220, 16, 'Overall Score', '/ 100');
  }

  let categoryGrid = '';
  if(categories && typeof categories === 'object' && Object.keys(categories).length){
    categoryGrid = '<div class="report-grid">' + Object.entries(categories).map(([label,val]) => (
      '<div class="card cat-card"><div class="cat-head">' + ic('gauge') + '<span>' + escapeHtml(label) + '</span><span class="push-right mono">' + val + '</span></div>' +
      '<div class="bar1d-track"><span class="bar1d-fill bar1d-primary" style="width:' + Math.max(0,Math.min(100,val)) + '%"></span></div></div>'
    )).join('') + '</div>';
  }

  let chartBlock = '';
  if(categories && typeof categories === 'object' && Object.keys(categories).length >= 3){
    chartBlock = '<div class="chart-grid"><div class="card chart-card" style="grid-column:1/-1;"><h3>Topic Radar</h3><canvas id="radarChart" height="220"></canvas></div></div>';
  }

  return '' +
  '<div class="page report-page">' +
    navBar('') +
    '<div class="report-hero"><h1>Interview Complete</h1><p class="muted">Here\'s how ' + escapeHtml(candName(c).split(' ')[0]) + ' performed.</p>' +
      scoreBlock +
    '</div>' +

    categoryGrid +
    chartBlock +

    '<div class="card summary-card"><h3>Summary</h3><p class="muted">' + escapeHtml(fb.summary || '—') + '</p></div>' +

    '<div class="sw-grid">' +
      '<div class="sw-col"><h3 class="sw-head sw-head-good">' + ic('check') + ' Strengths</h3>' + (fb.strengths||[]).map(s=>'<div class="sw-card sw-good">'+escapeHtml(s)+'</div>').join('') + '</div>' +
      '<div class="sw-col"><h3 class="sw-head sw-head-warn">' + ic('x') + ' Gaps</h3>' + (fb.gaps||[]).map(s=>'<div class="sw-card sw-warn">'+escapeHtml(s)+'</div>').join('') + '</div>' +
    '</div>' +

    '<div class="card reco-card"><h3>Recommended Next Steps</h3><div class="reco-list">' +
      (fb.next||[]).map((r,i) => '<div class="reco-item"><div class="reco-num">'+(i+1)+'</div><div><div class="muted">'+escapeHtml(r)+'</div></div></div>').join('') +
    '</div></div>' +

    '<div class="report-actions">' +
      '<button class="btn btn-ghost btn-lg" data-action="download-report">' + ic('download') + ' Download Report</button>' +
      '<button class="btn btn-primary btn-lg" data-action="retake">' + ic('retake') + ' Retake Interview</button>' +
    '</div>' +
  '</div>';
}

function firstDefined(){ for(const a of arguments){ if(a !== undefined && a !== null) return a; } return null; }

function drawCharts(){
  const fb = state.feedback;
  if(!fb || typeof Chart === 'undefined') return;
  const categories = fb.categories || fb.scores;
  const radarEl = document.getElementById('radarChart');
  if(radarEl && categories){
    new Chart(radarEl, {
      type: 'radar',
      data: { labels: Object.keys(categories), datasets: [{ label:'Score', data: Object.values(categories), backgroundColor:'rgba(108,59,255,0.25)', borderColor:'#6C3BFF', pointBackgroundColor:'#6C3BFF' }] },
      options: { plugins:{legend:{display:false}}, scales:{ r:{ min:0, max:100, grid:{color:'#E7E3F5'}, angleLines:{color:'#E7E3F5'}, ticks:{display:false}, pointLabels:{font:{size:11},color:'#69637F'} } } }
    });
  }
}

/* ============================================================================
   SMALL RENDER HELPERS
   ============================================================================ */

function brand(small){ return '<button class="brand brand-btn" data-action="go-landing">' + orb(small?26:32,false) + '<span class="brand-text">Interview Agent</span></button>'; }
function navBar(active){
  const links = [
    ['Candidates','go-dashboard','dashboard'],
    ['Curriculum','go-curriculum','curriculum'],
    ['How it Works','scroll-how-it-works',''],
  ];
  return '<nav class="nav">' + brand(true) +
    '<div class="nav-links">' + links.map(l => (
      '<button data-action="' + l[1] + '" class="' + (active===l[2]?'active':'') + '">' + l[0] + '</button>'
    )).join('') + '</div>' +
    backendBadge() +
  '</nav>';
}
function orb(size, active){ return '<div class="orb ' + (active?'orb-active':'') + '" style="width:' + size + 'px;height:' + size + 'px;min-width:' + size + 'px;"><div class="orb-core"></div></div>'; }
function sideStat(icon,label,val,wrap){ return '<div class="side-stat">' + ic(icon) + '<span>' + label + '</span><span class="mono push-right" style="'+(wrap?'font-size:12px;text-align:right;max-width:110px;':'')+'">' + escapeHtml(String(val)) + '</span></div>'; }
function sideStatId(icon,label,id,val){ return '<div class="side-stat">' + ic(icon) + '<span>' + label + '</span><span id="'+id+'" class="mono push-right">' + escapeHtml(String(val)) + '</span></div>'; }
function backendBadge(){
  if(state.backendState === 'ok') return '<span class="mode-badge mode-live"><span class="mode-dot"></span>Backend connected</span>';
  if(state.backendState === 'error') return '<span class="mode-badge mode-bad"><span class="mode-dot"></span>Backend unreachable</span>';
  return '<span class="mode-badge mode-demo"><span class="mode-dot"></span>Not connected yet</span>';
}
function initials(name){ return String(name).split(' ').map(n=>n[0]).join('').slice(0,2).toUpperCase(); }
function fmtTime(s){ const m=Math.floor(s/60).toString().padStart(2,'0'); const sec=(s%60).toString().padStart(2,'0'); return m+':'+sec; }

function scoreRingSvg(value, size, strokeW, label, sub){
  const r = (size-strokeW)/2, c = 2*Math.PI*r;
  const id = 'ring'+Math.random().toString(36).slice(2,8);
  return '<div class="score-ring-wrap" style="width:'+size+'px;height:'+size+'px;">' +
    '<svg width="'+size+'" height="'+size+'"><defs><linearGradient id="'+id+'" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#6C3BFF"/><stop offset="100%" stop-color="#8A5CFF"/></linearGradient></defs>' +
    '<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" stroke="#EDE9FA" stroke-width="'+strokeW+'" fill="none"/>' +
    '<circle class="ring-anim" data-value="'+value+'" data-circ="'+c+'" cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" stroke="url(#'+id+')" stroke-width="'+strokeW+'" fill="none" stroke-linecap="round" stroke-dasharray="'+c+'" stroke-dashoffset="'+c+'" transform="rotate(-90 '+size/2+' '+size/2+')" style="transition:stroke-dashoffset 1.1s cubic-bezier(.16,1,.3,1);"/></svg>' +
    '<div class="score-ring-center"><div class="score-ring-value" data-count-to="'+value+'">0</div>' + (label?'<div class="score-ring-label">'+label+'</div>':'') + (sub?'<div class="score-ring-sub">'+sub+'</div>':'') + '</div></div>';
}

function animateRings(){
  document.querySelectorAll('.ring-anim').forEach(el => {
    const v = parseFloat(el.dataset.value), c = parseFloat(el.dataset.circ);
    requestAnimationFrame(() => { el.style.strokeDashoffset = c - (v/100)*c; });
  });
  document.querySelectorAll('[data-count-to]').forEach(el => {
    const target = parseInt(el.dataset.countTo,10);
    const start = performance.now(), duration = 1200;
    function step(t){
      const p = Math.min(1,(t-start)/duration);
      const eased = 1-Math.pow(1-p,3);
      el.textContent = Math.round(eased*target);
      if(p<1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  });
}

function escapeHtml(str){ return String(str).replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s])); }
function escapeAttr(str){ return escapeHtml(str); }

/* ============================================================================
   APP ROOT / ROUTER
   ============================================================================ */

function render(){
  const root = document.getElementById('app');
  let html = '';
  if(state.view==='landing') html = renderLanding();
  else if(state.view==='dashboard') html = renderDashboard();
  else if(state.view==='curriculum') html = renderCurriculum();
  else if(state.view==='interview') html = renderInterview();
  else if(state.view==='report') html = renderReport();
  root.innerHTML = html;

  if(state.view==='interview'){
    const scroller = document.getElementById('chat-scroll');
    if(scroller) scroller.scrollTop = scroller.scrollHeight;
    const input = document.getElementById('composer-input');
    if(input){
      input.focus();
      input.addEventListener('keydown', (e) => {
        if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); handleSend(); }
      });
    }
    const sendBtn = document.getElementById('send-btn');
    if(sendBtn) sendBtn.addEventListener('click', handleSend);
  }
  if(state.view==='dashboard'){
    const search = document.getElementById('candidate-search');
    if(search){
      search.addEventListener('input', (e) => { state.search = e.target.value; render(); });
      search.focus();
      search.selectionStart = search.selectionEnd = search.value.length;
    }
    const mid = document.getElementById('manual-id');
    if(mid) mid.addEventListener('input', (e) => { state.manualId = e.target.value; });
    const mname = document.getElementById('manual-name');
    if(mname) mname.addEventListener('input', (e) => { state.manualName = e.target.value; });
  }
  if(state.view==='report'){
    animateRings();
    setTimeout(drawCharts, 50);
  }
}

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const action = el.dataset.action;
  if(action==='go-landing'){ stopTimer(); state.view='landing'; render(); }
  else if(action==='go-dashboard'){
    stopTimer(); state.view='dashboard'; render();
    if(state.candidatesStatus === 'idle') loadCandidates();
  }
  else if(action==='reload-candidates'){ loadCandidates(); }
  
  else if(action==='reload-curriculum'){ loadCurriculum(); }
  else if(action==='scroll-how-it-works'){
    if(state.view !== 'landing'){
      stopTimer(); state.view = 'landing'; render();
      requestAnimationFrame(() => requestAnimationFrame(() => {
        const target = document.getElementById('how-it-works-section');
        if(target) target.scrollIntoView({ behavior:'smooth', block:'start' });
      }));
    } else {
      const target = document.getElementById('how-it-works-section');
      if(target) target.scrollIntoView({ behavior:'smooth', block:'start' });
    }
  }
  
  else if(action==='use-manual-candidate'){
    const id = state.manualId.trim();
    if(!id){ alert('Please enter a candidate ID.'); return; }
    const obj = { id };
    if(state.manualName.trim()) obj.name = state.manualName.trim();
    state.selectedCandidate = obj; state.showRawCandidate = false; render();
  }
  else if(action==='toggle-raw'){ state.showRawCandidate = !state.showRawCandidate; render(); }
  else if(action==='start-interview'){ startInterview(); }
  else if(action==='exit-interview'){ stopTimer(); state.view='dashboard'; render(); }
  else if(action==='retake'){ resetInterviewState(); state.view='dashboard'; render(); }
  else if(action==='download-report'){ downloadReport(); }
  else if(action==='retry-last'){ retryLast(); }
});

function stopTimer(){ if(state.timer){ clearInterval(state.timer); state.timer=null; } }

function resetInterviewState(){
  stopTimer();
  state.sessionId = null; state.messages = []; state.turnCount = 0;
  state.thinking = false; state.elapsed = 0; state.done = false; state.feedback = null;
  state.meta = { topic:null, difficulty:null, followUp:false, progress:null, questionNumber:null, totalQuestions:null };
  state.lastPayload = null;
}


async function startInterview(){
  const c = state.selectedCandidate;
  if(!c) return;
  resetInterviewState();
  state.sessionId = 'sess-' + Math.random().toString(36).slice(2,10) + '-' + Date.now();
  state.view = 'interview';
  state.thinking = true;
  render();

  state.timer = setInterval(() => {
    state.elapsed++;
    const el = document.getElementById('elapsed-time');
    if(el) el.textContent = fmtTime(state.elapsed);
  }, 1000);

  const payload = { sessionId: state.sessionId, candidate: c };
  state.lastPayload = { kind:'start', payload };
  const res = await apiPost(INTERVIEW_ENDPOINT, payload);
  state.thinking = false;

  if(!res.ok){
    state.messages.push({ role:'error', text: res.error });
    render();
    return;
  }
  handleTurnResult(res.data);
}

async function handleSend(){
  const input = document.getElementById('composer-input');
  if(!input || state.thinking || state.done) return;
  const text = input.value.trim();
  if(!text) return;

  state.messages.push({ role:'user', text });
  state.turnCount++;
  state.thinking = true;
  render();

  const payload = { sessionId: state.sessionId, message: text };
  state.lastPayload = { kind:'turn', payload };
  const res = await apiPost(INTERVIEW_ENDPOINT, payload);
  state.thinking = false;

  if(!res.ok){
    state.messages.push({ role:'error', text: res.error });
    render();
    return;
  }
  handleTurnResult(res.data);
}

function handleTurnResult(data){
  if(typeof data.reply !== 'string' || typeof data.done !== 'boolean'){
    state.messages.push({ role:'error', text: 'Backend response was missing required fields ("reply": string, "done": boolean). Got: ' + JSON.stringify(data).slice(0,200) });
    render();
    return;
  }
  applyMeta(data);

  if(data.done){
    state.done = true;
    state.feedback = data.feedback || { summary: data.reply, strengths:[], gaps:[], next:[] };
    state.messages.push({ role:'system', text: data.reply });
    render();
    stopTimer();
    setTimeout(() => { state.view = 'report'; render(); }, 1000);
    return;
  }

  state.messages.push({ role:'ai', text: data.reply, topic: state.meta.topic, difficulty: state.meta.difficulty, followUp: state.meta.followUp });
  render();
}

async function retryLast(){
  if(!state.lastPayload) return;
  // drop the trailing error bubble
  state.messages = state.messages.filter((m,i) => !(i === state.messages.length-1 && m.role === 'error'));
  state.thinking = true;
  render();
  const res = await apiPost(INTERVIEW_ENDPOINT, state.lastPayload.payload);
  state.thinking = false;
  if(!res.ok){
    state.messages.push({ role:'error', text: res.error });
    render();
    return;
  }
  handleTurnResult(res.data);
}

function downloadReport(){
  const c = state.selectedCandidate;
  const fb = state.feedback;
  if(!c || !fb) return;
  const lines = [
    
    'Candidate: ' + candName(c) + (candId(c) ? (' (' + candId(c) + ')') : ''),
  ];
  const overall = firstDefined(fb.overall, fb.score, fb.overallScore);
  if(overall != null) lines.push('Overall Score: ' + overall + ' / 100');
  const categories = fb.categories || fb.scores;
  if(categories){ lines.push('', 'Category Scores:'); Object.entries(categories).forEach(([k,v]) => lines.push('- ' + k + ': ' + v)); }
  lines.push('', 'Summary:', fb.summary || '—');
  lines.push('', 'Strengths:', ...(fb.strengths||[]).map(s=>'- '+s));
  lines.push('', 'Gaps:', ...(fb.gaps||[]).map(s=>'- '+s));
  lines.push('', 'Next Steps:', ...(fb.next||[]).map(s=>'- '+s));
  const blob = new Blob([lines.join('\n')], { type: 'text/plain' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'interview-feedback-' + (candId(c)||'candidate') + '.txt'; a.click();
  URL.revokeObjectURL(url);
}

render();
</script>
