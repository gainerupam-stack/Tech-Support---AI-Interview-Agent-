    --bg: #0b0f1a;
    --bg2: #111827;
    --card: #151c2e;
    --border: #1e293b;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #6366f1;
    --accent2: #818cf8;
    --good: #22c55e;
    --warn: #f59e0b;
    --bad: #ef4444;
    --radius: 14px;
    --font: "Inter", system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.5;
  }
  a { color: var(--accent2); text-decoration: none; }
  button {
    font-family: inherit;
    cursor: pointer;
    border: none;
    border-radius: 10px;
    font-weight: 600;
    transition: transform .15s, opacity .15s, background .15s;
  }
  button:active { transform: scale(.98); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .btn-primary {
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    color: #fff;
    padding: 12px 22px;
    font-size: 15px;
  }
  .btn-primary:hover:not(:disabled) { filter: brightness(1.1); }
  .btn-ghost {
    background: transparent;
    color: var(--muted);
    padding: 8px 14px;
    border: 1px solid var(--border);
  }
  .btn-ghost:hover { color: var(--text); border-color: #334155; }
  .btn-danger {
    background: #7f1d1d;
    color: #fecaca;
    padding: 10px 16px;
  }

  /* Nav */
  .nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 28px;
    border-bottom: 1px solid var(--border);
    background: rgba(11,15,26,.85);
    backdrop-filter: blur(12px);
    position: sticky;
    top: 0;
    z-index: 50;
  }
  .nav-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 700;
    font-size: 17px;
    background: none;
    color: var(--text);
    border: none;
    padding: 0;
  }
  .nav-brand .orb {
    width: 28px; height: 28px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #a5b4fc, #6366f1 60%, #312e81);
    box-shadow: 0 0 16px rgba(99,102,241,.5);
  }
  .nav-links { display: flex; gap: 6px; flex-wrap: wrap; }
  .nav-links button {
    background: none;
    color: var(--muted);
    padding: 8px 14px;
    border-radius: 8px;
    font-weight: 500;
    font-size: 14px;
  }
  .nav-links button:hover, .nav-links button.active {
    color: var(--text);
    background: rgba(99,102,241,.12);
  }

  /* Layout helpers */
  .page { max-width: 1100px; margin: 0 auto; padding: 32px 24px 64px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px;
  }
  .muted { color: var(--muted); }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 999px;
    background: rgba(99,102,241,.15);
    color: var(--accent2);
  }
  .badge.live { background: rgba(34,197,94,.15); color: #4ade80; }
  .badge.demo { background: rgba(245,158,11,.15); color: #fbbf24; }
  .badge.err { background: rgba(239,68,68,.15); color: #f87171; }

  /* Landing */
  .hero {
    text-align: center;
    padding: 64px 16px 48px;
    position: relative;
  }
  .hero-orb {
    width: 96px; height: 96px;
    margin: 0 auto 28px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #c7d2fe, #6366f1 55%, #1e1b4b);
    box-shadow: 0 0 60px rgba(99,102,241,.45), 0 0 120px rgba(139,92,246,.2);
    animation: pulse 3.5s ease-in-out infinite;
  }
  @keyframes pulse {
    0%,100% { transform: scale(1); box-shadow: 0 0 60px rgba(99,102,241,.45); }
    50% { transform: scale(1.06); box-shadow: 0 0 80px rgba(99,102,241,.65); }
  }
  .hero h1 {
    font-size: clamp(2rem, 5vw, 3.1rem);
    font-weight: 800;
    letter-spacing: -0.03em;
    margin-bottom: 14px;
    background: linear-gradient(135deg, #e0e7ff, #a5b4fc 40%, #c4b5fd);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .hero p { color: var(--muted); max-width: 540px; margin: 0 auto 28px; font-size: 17px; }
  .hero-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .features {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 16px;
    margin-top: 48px;
  }
  .feature { text-align: left; }
  .feature h3 { font-size: 15px; margin-bottom: 6px; }
  .feature p { font-size: 13px; color: var(--muted); }
  .how { margin-top: 64px; }
  .how h2 { text-align: center; margin-bottom: 28px; font-size: 1.5rem; }
  .steps {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 16px;
  }
  .step {
    text-align: center;
    padding: 20px 14px;
  }
  .step-num {
    width: 36px; height: 36px;
    border-radius: 50%;
    background: rgba(99,102,241,.2);
    color: var(--accent2);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    margin-bottom: 10px;
  }
  .step h4 { font-size: 14px; margin-bottom: 4px; }
  .step p { font-size: 12px; color: var(--muted); }

  /* Dashboard */
  .dash-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }
  .search {
    width: 100%;
    max-width: 360px;
    padding: 11px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--bg2);
    color: var(--text);
    font-size: 14px;
    outline: none;
  }
  .search:focus { border-color: var(--accent); }
  .cand-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 14px;
  }
  .cand-card {
    cursor: pointer;
    transition: border-color .15s, transform .15s;
  }
  .cand-card:hover { border-color: var(--accent); transform: translateY(-2px); }
  .cand-card.selected { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .cand-card h3 { font-size: 15px; margin-bottom: 4px; }
  .cand-meta { font-size: 12px; color: var(--muted); }
  .cand-stats {
    display: flex;
    gap: 12px;
    margin-top: 12px;
    font-size: 12px;
  }
  .cand-stats span { color: var(--muted); }
  .cand-stats strong { color: var(--text); }
  .selected-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 16px 20px;
    background: rgba(99,102,241,.1);
    border: 1px solid rgba(99,102,241,.35);
    border-radius: var(--radius);
    margin-bottom: 24px;
    flex-wrap: wrap;
  }

  /* Interview */
  .interview-layout {
    display: grid;
    grid-template-columns: 220px 1fr 200px;
    gap: 18px;
    min-height: 70vh;
  }
  @media (max-width: 900px) {
    .interview-layout { grid-template-columns: 1fr; }
    .side-panel { display: none; }
  }
  .side-panel .card { margin-bottom: 12px; }
  .chat-panel {
    display: flex;
    flex-direction: column;
    height: min(70vh, 640px);
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .bubble {
    max-width: 88%;
    padding: 12px 16px;
    border-radius: 14px;
    font-size: 14px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .bubble.bot {
    background: #1e293b;
    align-self: flex-start;
    border-bottom-left-radius: 4px;
  }
  .bubble.user {
    background: linear-gradient(135deg, #4f46e5, #7c3aed);
    align-self: flex-end;
    border-bottom-right-radius: 4px;
  }
  .bubble.system {
    align-self: center;
    background: transparent;
    color: var(--muted);
    font-size: 12px;
    text-align: center;
  }
  .bubble.meta {
    font-size: 12px;
    color: var(--muted);
    background: rgba(34,197,94,.08);
    border: 1px solid rgba(34,197,94,.2);
    align-self: flex-start;
  }
  .composer {
    display: flex;
    gap: 10px;
    padding: 14px;
    border-top: 1px solid var(--border);
    background: var(--bg2);
  }
  .composer textarea {
    flex: 1;
    resize: none;
    min-height: 48px;
    max-height: 120px;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    outline: none;
  }
  .composer textarea:focus { border-color: var(--accent); }
  .composer button { padding: 0 20px; }

  .stat-row {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    padding: 6px 0;
    border-bottom: 1px solid var(--border);
  }
  .stat-row:last-child { border-bottom: none; }
  .score-big {
    font-size: 2rem;
    font-weight: 800;
    text-align: center;
  }
  .thinking {
    display: flex;
    gap: 5px;
    padding: 8px 0;
  }
  .thinking span {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--accent2);
    animation: bounce 1.2s infinite;
  }
  .thinking span:nth-child(2) { animation-delay: .15s; }
  .thinking span:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce {
    0%,80%,100% { transform: translateY(0); opacity: .4; }
    40% { transform: translateY(-6px); opacity: 1; }
  }

  /* Report */
  .report-hero {
    text-align: center;
    margin-bottom: 32px;
  }
  .score-ring-wrap {
    width: 140px; height: 140px;
    margin: 0 auto 16px;
    position: relative;
  }
  .score-ring-wrap canvas { width: 140px !important; height: 140px !important; }
  .score-center {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }
  .score-center strong { font-size: 2rem; line-height: 1; }
  .score-center span { font-size: 12px; color: var(--muted); }
  .report-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
    margin-bottom: 24px;
  }
  @media (max-width: 700px) { .report-grid { grid-template-columns: 1fr; } }
  .list-block ul { padding-left: 18px; margin-top: 8px; }
  .list-block li { margin-bottom: 6px; font-size: 14px; }
  .list-block.strengths li { color: #86efac; }
  .list-block.weaknesses li { color: #fca5a5; }
  .para { font-size: 14px; color: var(--muted); margin-top: 8px; white-space: pre-wrap; }
  .report-actions {
    display: flex;
    gap: 12px;
    justify-content: center;
    margin-top: 28px;
    flex-wrap: wrap;
  }

  /* Curriculum */
  .mod-block { margin-bottom: 24px; }
  .mod-block h3 {
    font-size: 15px;
    margin-bottom: 10px;
    color: var(--accent2);
  }
  .day-list {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 8px;
  }
  .day-item {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    padding: 10px 12px;
    background: var(--bg2);
    border-radius: 10px;
    border: 1px solid var(--border);
    font-size: 13px;
  }
  .day-num {
    flex-shrink: 0;
    width: 28px; height: 28px;
    border-radius: 8px;
    background: rgba(99,102,241,.15);
    color: var(--accent2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 12px;
  }
  .day-type {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: .04em;
    color: var(--muted);

  .error-box {
    background: rgba(239,68,68,.1);
    border: 1px solid rgba(239,68,68,.35);
    color: #fca5a5;
    padding: 14px 16px;
    border-radius: 12px;
    font-size: 14px;
    margin: 12px 0;
  }
  .config-bar {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .config-bar input {
    background: var(--bg2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 10px;
    border-radius: 8px;
    font-size: 12px;
    min-width: 220px;
  }
</style>

// STATE

const state = {
  view: 'landing',          // landing | dashboard | curriculum | interview | report
  selectedCandidate: null,
  sessionId: null,
  messages: [],             // {role:'bot'|'user'|'system'|'meta', text}
  questionNumber: 0,
  curriculumDay: null,
  lastScore: null,
  lastFeedback: null,
  done: false,
  finalEvaluationRaw: null,
  finalParsed: null,
  loading: false,
  error: null,
  apiLive: null,            // null | true | false
  historyScores: [],        // for mini chart
};

function uid() {
  return 'sess-' + Math.random().toString(36).slice(2) + Date.now().toString(36);
}

// ============================================================
// API
// ============================================================
async function callInterview(payload) {
  const url = (API_BASE_URL || '') + INTERVIEW_ENDPOINT;
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 60000); // LLM can be slow
  try {
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
      signal: ctrl.signal,
    });
    clearTimeout(timer);
    if (!res.ok) {
      let detail = res.statusText;
      try {
        const j = await res.json();
        detail = j.detail || JSON.stringify(j);
      } catch (_) {}
      throw new Error(typeof detail === 'string' ? detail : JSON.stringify(detail));
    }
    const data = await res.json();
    if (typeof data.reply !== 'string' || typeof data.done !== 'boolean') {
      throw new Error('Invalid response shape from backend (need reply + done)');
    }
    state.apiLive = true;
    return data;
  } catch (err) {
    clearTimeout(timer);
    state.apiLive = false;
    throw err;
  }
}

function parseFinalEvaluation(text) {
  if (!text) return null;
  const out = {
    overall: null,
    strengths: [],
    weaknesses: [],
    technical: '',
    communication: '',
    recommendation: '',
  };
  const lines = text.split(/\r?\n/);
  let section = null;
  for (const raw of lines) {
    const line = raw.trim();
    if (!line) continue;
    if (/^OVERALL_SCORE:/i.test(line)) {
      const m = line.match(/OVERALL_SCORE:\s*([\d.]+)/i);
      if (m) out.overall = parseFloat(m[1]);
      section = null;
    } else if (/^STRENGTHS:/i.test(line)) {
      section = 'strengths';
    } else if (/^WEAKNESSES:/i.test(line)) {
      section = 'weaknesses';
    } else if (/^TECHNICAL_ASSESSMENT:/i.test(line)) {
      section = 'technical';
      const rest = line.replace(/^TECHNICAL_ASSESSMENT:\s*/i, '').trim();
      if (rest) out.technical += rest + ' ';
    } else if (/^COMMUNICATION_ASSESSMENT:/i.test(line)) {
      section = 'communication';
      const rest = line.replace(/^COMMUNICATION_ASSESSMENT:\s*/i, '').trim();
      if (rest) out.communication += rest + ' ';
    } else if (/^RECOMMENDATION:/i.test(line)) {
      section = 'recommendation';
      const rest = line.replace(/^RECOMMENDATION:\s*/i, '').trim();
      if (rest) out.recommendation += rest + ' ';
    } else if (section === 'strengths' && line.startsWith('-')) {
      out.strengths.push(line.replace(/^-\s*/, ''));
    } else if (section === 'weaknesses' && line.startsWith('-')) {
      out.weaknesses.push(line.replace(/^-\s*/, ''));
    } else if (section === 'technical') {
      out.technical += line + ' ';
    } else if (section === 'communication') {
      out.communication += line + ' ';
    } else if (section === 'recommendation') {
      out.recommendation += line + ' ';
    }
  }
  out.technical = out.technical.trim();
  out.communication = out.communication.trim();
  out.recommendation = out.recommendation.trim();
  return out;
}

async function startInterview() {
  if (!state.selectedCandidate) return;
  state.sessionId = uid();
  state.messages = [];
  state.questionNumber = 0;
  state.curriculumDay = null;
  state.lastScore = null;
  state.lastFeedback = null;
  state.done = false;
  state.finalEvaluationRaw = null;
  state.finalParsed = null;
  state.historyScores = [];
  state.error = null;
  state.loading = true;
  state.view = 'interview';
  render();

  try {
    const data = await callInterview({
      sessionId: state.sessionId,
      candidate: { member: { id: state.selectedCandidate.id } },
    });
    state.questionNumber = data.question_number || 1;
    state.curriculumDay = data.curriculum_day ?? null;
    state.messages.push({ role: 'bot', text: data.reply });
    if (data.done) {
      // unlikely on start, but handle
      finishWith(data);
    }
  } catch (err) {
    state.error = err.message || String(err);
    state.messages.push({ role: 'system', text: 'Failed to start interview: ' + state.error });
  } finally {
    state.loading = false;
    render();
    scrollChat();
  }
}

async function sendAnswer() {
  const ta = document.getElementById('answer-input');
  if (!ta) return;
  const text = ta.value.trim();
  if (!text || state.loading || state.done) return;

  state.messages.push({ role: 'user', text });
  ta.value = '';
  state.loading = true;
  state.error = null;
  render();
  scrollChat();

  try {
    const data = await callInterview({
      sessionId: state.sessionId,
      message: text,
    });

    if (data.score != null) {
      state.lastScore = data.score;
      state.historyScores.push(data.score);
    }
    if (data.feedback) {
      state.lastFeedback = data.feedback;
      state.messages.push({
        role: 'meta',
        text: `Score: ${data.score != null ? data.score + '/10' : '—'}  ·  ${data.feedback}`,
      });
    }
    if (data.question_number != null) state.questionNumber = data.question_number;
    if (data.curriculum_day != null) state.curriculumDay = data.curriculum_day;

    if (data.done) {
      finishWith(data);
    } else {
      state.messages.push({ role: 'bot', text: data.reply });
    }
  } catch (err) {
    state.error = err.message || String(err);
    state.messages.push({ role: 'system', text: 'Error: ' + state.error });
  } finally {
    state.loading = false;
    render();
    scrollChat();
  }
}

function finishWith(data) {
  state.done = true;
  state.finalEvaluationRaw = data.final_evaluation || '';
  state.finalParsed = parseFinalEvaluation(state.finalEvaluationRaw);
  if (data.score != null) state.lastScore = data.score;
  if (data.feedback) state.lastFeedback = data.feedback;
  state.messages.push({ role: 'bot', text: data.reply || 'Interview completed.' });
  state.messages.push({ role: 'system', text: 'Interview finished. Opening report…' });
  setTimeout(() => {
    state.view = 'report';
    render();
  }, 900);
}

function scrollChat() {
  requestAnimationFrame(() => {
    const el = document.getElementById('chat-messages');
    if (el) el.scrollTop = el.scrollHeight;
  });
}

  else if (state.view === 'report') html = renderReport();

  if (state.view === 'report') {
    requestAnimationFrame(() => {

        const overall = (state.finalParsed && state.finalParsed.overall != null)
          ? state.finalParsed.overall
          : (state.lastScore != null ? state.lastScore : 0);
        const pct = Math.min(10, Math.max(0, overall)) / 10;
        new Chart(ring, {
          type: 'doughnut',
          data: {
            datasets: [{
              data: [pct, 1 - pct],
              backgroundColor: ['#6366f1', '#1e293b'],
              borderWidth: 0,
            }],
          },
          options: {
            cutout: '78%',
            plugins: { legend: { display: false }, tooltip: { enabled: false } },
            animation: { animateRotate: true },
          },
        });
      }
      const bars = document.getElementById('score-bars');
      if (bars && window.Chart && state.historyScores.length) {
        new Chart(bars, {
          type: 'bar',
          data: {
            labels: state.historyScores.map((_, i) => 'Q' + (i + 1)),
            datasets: [{
              data: state.historyScores,
              backgroundColor: state.historyScores.map(s =>
                s >= 8 ? '#22c55e' : s >= 5 ? '#f59e0b' : '#ef4444'),
              borderRadius: 6,
            }],
          },
          options: {
            scales: {
              y: { min: 0, max: 10, ticks: { color: '#94a3b8' }, grid: { color: '#1e293b' } },
              x: { ticks: { color: '#94a3b8' }, grid: { display: false } },
            },
            plugins: { legend: { display: false } },
          },
        });
      }
    });
  }

  // Focus composer
  if (state.view === 'interview' && !state.loading && !state.done) {
    const ta = document.getElementById('answer-input');
    if (ta) ta.focus();
  }
}

// ============================================================
// EVENTS
// ============================================================
document.addEventListener('click', (e) => {
  const btn = e.target.closest('[data-action]');
  if (!btn) return;
  const action = btn.dataset.action;

  if (action === 'go-landing') { state.view = 'landing'; render(); }
  else if (action === 'go-dashboard') { state.view = 'dashboard'; render(); }
  else if (action === 'go-curriculum') { state.view = 'curriculum'; render(); }
  else if (action === 'scroll-how') {
    document.getElementById('how-it-works')?.scrollIntoView({ behavior: 'smooth' });
  }
  else if (action === 'select-cand') {
    const id = btn.dataset.id;
    state.selectedCandidate = CANDIDATES.find(c => c.id === id) || null;
    render();
  }
  else if (action === 'start-interview') {
    startInterview();
  }
  else if (action === 'send-answer') {
    sendAnswer();
  }
  else if (action === 'retry-last') {
    state.error = null;
    render();
  }
  else if (action === 'save-api-base') {
    const inp = document.getElementById('api-base-input');
    if (inp) {
      // mutate the const via global — reassign through window
      window.__API_BASE_URL = inp.value.trim().replace(/\/$/, '');
      // monkey-patch: we can't reassign const, so store and use helper
      Object.defineProperty(window, 'API_BASE_OVERRIDE', { value: window.__API_BASE_URL, writable: true });
      // simpler: just rewrite the module-level via a setter pattern
      // Actually easiest: reload config from input on each call
      alert('Base URL saved for this session: ' + (inp.value.trim() || '(same origin)'));
      // We'll read from the input field live — patch callInterview
    }
  }
  else if (action === 'download-report') {
    const p = state.finalParsed || {};
    const lines = [
      'AI Interview Report',
      'Candidate: ' + (state.selectedCandidate?.name || '') + ' (' + (state.selectedCandidate?.id || '') + ')',
      'Overall score: ' + (p.overall != null ? p.overall : '—') + '/10',
      '',
      'STRENGTHS:',
      ...(p.strengths || []).map(s => '- ' + s),
      '',
      'WEAKNESSES:',
      ...(p.weaknesses || []).map(s => '- ' + s),
      '',
      'TECHNICAL ASSESSMENT:',
      p.technical || '—',
      '',
      'COMMUNICATION ASSESSMENT:',
      p.communication || '—',
      '',
      'RECOMMENDATION:',
      p.recommendation || '—',
      '',
      '--- Raw ---',
      state.finalEvaluationRaw || '',
    ];
    const blob = new Blob([lines.join('\n')], { type: 'text/plain' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'interview-report-' + (state.selectedCandidate?.id || 'unknown') + '.txt';
    a.click();
  }
});

document.addEventListener('input', (e) => {
  if (e.target.id === 'cand-search') render();
});

document.addEventListener('keydown', (e) => {
  if (e.target.id === 'answer-input' && e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendAnswer();
  }
});

// Live API base override from input without page reload
const _origCall = callInterview;
callInterview = async function(payload) {
  const inp = document.getElementById('api-base-input');
  const override = inp ? inp.value.trim().replace(/\/$/, '') : null;
  const base = override != null && override !== '' ? override : (window.__API_BASE_URL || API_BASE_URL);
  // temporarily swap
  const url = (base || '') + INTERVIEW_ENDPOINT;
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 60000);
  try {
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
      signal: ctrl.signal,
    });
    clearTimeout(timer);
    if (!res.ok) {
      let detail = res.statusText;
      try { const j = await res.json(); detail = j.detail || JSON.stringify(j); } catch (_) {}
      throw new Error(typeof detail === 'string' ? detail : JSON.stringify(detail));
    }
    const data = await res.json();
    if (typeof data.reply !== 'string' || typeof data.done !== 'boolean') {
      throw new Error('Invalid response shape from backend (need reply + done)');
    }
    state.apiLive = true;
    return data;
  } catch (err) {
    clearTimeout(timer);
    state.apiLive = false;
    throw err;
  }
};

render();
</script>
